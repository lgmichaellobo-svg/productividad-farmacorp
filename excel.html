<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Automatizados - Farmacorp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 font-sans h-screen flex overflow-hidden">

    <!-- Menú Lateral (Igual que el inicio) -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex-col hidden md:flex shadow-2xl z-10">
        <div class="p-6 flex items-center gap-3 border-b border-slate-800">
            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-lg">
                <i class="fa-solid fa-pills text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white tracking-wide">Farmacorp</h1>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest">Sistema Interno</p>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-1 mt-4">
            <a href="app.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
                <i class="fa-solid fa-house w-5"></i> Inicio
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
                <i class="fa-solid fa-chart-line w-5"></i> Productividad
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
                <i class="fa-solid fa-boxes-stacked w-5"></i> Verificación
            </a>
            <a href="excel.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl shadow-md transition">
                <i class="fa-solid fa-file-excel w-5"></i> Excel Automatizados
            </a>
        </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-10">
            <h2 class="text-xl font-bold text-slate-800">Excel Automatizados</h2>
            <a href="app.html" class="text-sm text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Volver
            </a>
        </header>

        <div class="p-6 md:p-10 flex-1 max-w-7xl mx-auto w-full">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                
                <!-- Tarjeta Excel 1 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-12 h-12 bg-green-100 text-green-600 rounded-xl flex items-center justify-center text-xl">
                            <i class="fa-solid fa-file-excel"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">NO CAPTURADOS</h3>
                            <p class="text-xs text-slate-500">Versión: 1.0</p>
                        </div>
                    </div>
                    <button class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl transition font-medium flex items-center justify-center gap-2">
                        <i class="fa-solid fa-download"></i> Descargar
                    </button>
                </div>

                <!-- Tarjeta Excel 2 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-12 h-12 bg-green-100 text-green-600 rounded-xl flex items-center justify-center text-xl">
                            <i class="fa-solid fa-file-excel"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">REVISIÓN X MONTO</h3>
                            <p class="text-xs text-slate-500">Versión: 1.0</p>
                        </div>
                    </div>
                    <button class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl transition font-medium flex items-center justify-center gap-2">
                        <i class="fa-solid fa-download"></i> Descargar
                    </button>
                </div>

                <!-- Tarjeta Excel 3 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-12 h-12 bg-green-100 text-green-600 rounded-xl flex items-center justify-center text-xl">
                            <i class="fa-solid fa-file-excel"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">POR ORDEN</h3>
                            <p class="text-xs text-slate-500">Versión: 1.0</p>
                        </div>
                    </div>
                    <button class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl transition font-medium flex items-center justify-center gap-2">
                        <i class="fa-solid fa-download"></i> Descargar
                    </button>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
