<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Automatizados - Farmacorp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; } 
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex overflow-hidden">

    <!-- MODAL PARA SUBIR ARCHIVO (Solo Admin) -->
    <div id="modalSubir" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 md:p-8 animate-fade-up">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                </div>
                <h3 class="text-xl font-extrabold text-slate-800">Subir Excel</h3>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-bold text-slate-700 mb-2">Nombre de la Herramienta</label>
                <input type="text" id="inputNombre" class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-emerald-500 outline-none font-bold text-slate-800 uppercase" placeholder="Ej. NO CAPTURADOS">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-bold text-slate-700 mb-2">Versión (Opcional)</label>
                <input type="text" id="inputVersion" class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-emerald-500 outline-none font-bold text-slate-800" value="1.0">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-bold text-slate-700 mb-2">Archivo Excel (.xlsx / .xls)</label>
                <input type="file" id="inputArchivo" accept=".xlsx, .xls" class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 transition">
            </div>

            <div class="flex gap-3">
                <button id="btnCancelarSubida" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-xl transition">Cancelar</button>
                <button id="btnConfirmarSubida" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-slate-500/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-upload"></i> Subir
                </button>
            </div>
        </div>
    </div>

    <!-- Menú Lateral -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex-col hidden lg:flex shadow-2xl z-20 relative flex-shrink-0 border-r border-slate-800">
        <div class="p-6 flex items-center gap-3 border-b border-slate-800">
            <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-blue-400 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/40">
                <i class="fa-solid fa-pills text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-extrabold text-white tracking-tight">Farmacorp</h1>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Sistema Interno</p>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-2 mt-2 overflow-y-auto">
            <a href="app.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition font-semibold text-sm"><i class="fa-solid fa-house w-5 text-center"></i> <span class="uppercase">Inicio</span></a>
            
            <!-- Activo -->
            <a href="excel.html" class="flex items-center gap-3 px-4 py-3 bg-emerald-600/10 text-emerald-400 border border-emerald-500/20 rounded-xl transition font-bold text-sm"><i class="fa-solid fa-file-excel w-5 text-center"></i> <span class="uppercase">Excel Automatizados</span></a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button id="btnLogoutDesktop" class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-red-600 text-slate-300 hover:text-white py-3 rounded-xl transition font-medium shadow-md">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto relative">
        <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-emerald-50/70 to-slate-50 -z-10"></div>

        <header class="glass-effect sticky top-0 z-10 px-6 py-4 flex justify-between items-center border-b border-slate-200/60 shadow-sm">
            <h2 class="text-xl font-extrabold text-slate-800 tracking-tight">Excel Automatizados</h2>
            <a href="app.html" class="text-sm text-slate-500 hover:text-slate-800 font-bold flex items-center gap-2 bg-white border border-slate-200 px-4 py-2.5 rounded-xl transition shadow-sm">
                <i class="fa-solid fa-arrow-left"></i> Volver al inicio
            </a>
        </header>

        <div class="p-4 md:p-8 flex-1 max-w-5xl mx-auto w-full">
            
            <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200 mb-8 animate-fade-up">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                    <div>
                        <h3 class="text-2xl font-extrabold text-slate-800 flex items-center gap-3">
                            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center">
                                <i class="fa-solid fa-file-excel text-xl"></i>
                            </div>
                            Herramientas y Macros
                        </h3>
                        <p class="text-slate-500 mt-2 font-medium">Descarga las últimas versiones aprobadas de tus archivos de Excel.</p>
                    </div>
                    
                    <!-- ESTE BOTÓN SOLO SE VERÁ SI EL ROL ES ADMIN -->
                    <button id="btnAbrirModal" class="hidden bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 px-5 rounded-xl transition shadow-md flex items-center gap-2 text-sm">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Subir nueva versión
                    </button>
                </div>

                <div id="listaExcel" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Tarjetas inyectadas por JS -->
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://wwurfjenenlvrhwakmso.supabase.co';
        const supabaseKey = 'sb_publishable_cn1zFLzla27K4l4EPltEbw_8YAgoq0C'; 
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const modalSubir = document.getElementById('modalSubir');
        let usuarioRol = "";

        // 1. Verificar el rol del usuario
        async function checkAdmin() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            const { data: usuarioDB } = await _supabase.from('usuarios').select('rol').eq('email', session.user.email).single();
            
            if (usuarioDB && usuarioDB.rol === 'admin') {
                usuarioRol = 'admin';
                document.getElementById('btnAbrirModal').classList.remove('hidden'); // Mostrar botón
            }
            
            cargarExcel(); // Cargar la lista para todos
        }

        // 2. Cargar la lista de Excel desde Supabase
        async function cargarExcel() {
            const contenedor = document.getElementById('listaExcel');
            contenedor.innerHTML = '<div class="text-center py-10 col-span-3"><i class="fa-solid fa-spinner fa-spin text-3xl text-emerald-500"></i></div>';

            const { data, error } = await _supabase
                .from('excel_automatizados')
                .select('*')
                .order('fecha_creacion', { ascending: false });

            if (error) {
                contenedor.innerHTML = `<p class="text-rose-500 font-bold col-span-3 text-center">Error al cargar: ${error.message}</p>`;
                return;
            }

            contenedor.innerHTML = '';
            if (data.length === 0) {
                contenedor.innerHTML = '<p class="text-slate-500 font-medium col-span-3 text-center py-8">No hay archivos subidos aún.</p>';
                return;
            }

            data.forEach((file) => {
                const fecha = new Date(file.fecha_creacion).toLocaleDateString();
                
                contenedor.innerHTML += `
                    <div class="bg-slate-50 p-6 rounded-3xl border border-slate-200 hover:border-emerald-300 transition-all hover:shadow-md group animate-fade-up">
                        <div class="flex items-start justify-between mb-5">
                            <div class="w-14 h-14 bg-white text-emerald-600 rounded-2xl flex items-center justify-center shadow-sm border border-slate-100 group-hover:scale-110 transition-transform">
                                <i class="fa-solid fa-file-excel text-2xl"></i>
                            </div>
                            <span class="bg-emerald-100 text-emerald-700 text-[10px] font-extrabold px-2.5 py-1 rounded-lg uppercase tracking-wider border border-emerald-200">Aprobado</span>
                        </div>
                        <h4 class="font-extrabold text-slate-800 text-lg mb-1 truncate" title="${file.nombre}">${file.nombre}</h4>
                        <p class="text-xs text-slate-500 mb-1 font-medium">Versión actual: <span class="font-bold text-slate-700">${file.version}</span></p>
                        <p class="text-xs text-slate-400 mb-6 font-medium"><i class="fa-regular fa-clock mr-1"></i> Actualizado el ${fecha}</p>
                        
                        <a href="${file.url_archivo}" target="_blank" class="w-full bg-white border-2 border-emerald-500 text-emerald-600 hover:bg-emerald-500 hover:text-white font-bold py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                            <i class="fa-solid fa-download"></i> Descargar Excel
                        </a>
                    </div>
                `;
            });
        }

        // 3. Lógica del Modal (Subir)
        document.getElementById('btnAbrirModal').addEventListener('click', () => {
            document.getElementById('inputNombre').value = '';
            document.getElementById('inputVersion').value = '1.0';
            document.getElementById('inputArchivo').value = '';
            modalSubir.classList.remove('hidden');
        });

        document.getElementById('btnCancelarSubida').addEventListener('click', () => {
            modalSubir.classList.add('hidden');
        });

        document.getElementById('btnConfirmarSubida').addEventListener('click', async () => {
            const btn = document.getElementById('btnConfirmarSubida');
            const nombre = document.getElementById('inputNombre').value.trim().toUpperCase();
            const version = document.getElementById('inputVersion').value.trim();
            const archivo = document.getElementById('inputArchivo').files[0];

            if (!nombre || !archivo) {
                alert("Por favor, ingresa un nombre y selecciona un archivo.");
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Subiendo...';
            btn.disabled = true;

            try {
                const nombreLimpio = archivo.name.replace(/[^a-zA-Z0-9.]/g, '_');
                const rutaArchivo = `${Date.now()}_${nombreLimpio}`;

                // Subir al Bucket (Usando el nombre con guion que tienes en Supabase)
                const { error: uploadError } = await _supabase.storage
                    .from('excel-automatizados')
                    .upload(rutaArchivo, archivo);

                if (uploadError) throw uploadError;

                // Obtener URL Pública
                const { data: urlData } = _supabase.storage
                    .from('excel-automatizados')
                    .getPublicUrl(rutaArchivo);

                // Guardar en la Base de Datos
                const { data: { session } } = await _supabase.auth.getSession();
                
                const { error: dbError } = await _supabase.from('excel_automatizados').insert([{
                    nombre: nombre,
                    version: version,
                    url_archivo: urlData.publicUrl,
                    creado_por: session.user.id
                }]);

                if (dbError) throw dbError;

                modalSubir.classList.add('hidden');
                alert('¡Archivo subido exitosamente!');
                cargarExcel(); // Refrescar la lista

            } catch (error) {
                alert("Error al subir: " + error.message);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-upload"></i> Subir';
                btn.disabled = false;
            }
        });

        const logoutFunc = async () => { await _supabase.auth.signOut(); window.location.href = 'index.html'; };
        document.getElementById('btnLogoutDesktop').addEventListener('click', logoutFunc);

        // Iniciar
        checkAdmin();
    </script>
</body>
</html>
