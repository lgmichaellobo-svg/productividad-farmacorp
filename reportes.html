<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Farmacorp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        body { font-family: 'Inter', sans-serif; } 
        .card-premium { 
            background: rgba(255, 255, 255, 0.95); 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); 
            border: 1px solid rgba(226, 232, 240, 0.8); 
            backdrop-filter: blur(10px); 
        }
    </style>
</head>
<body class="bg-slate-50 font-sans h-screen flex overflow-hidden">

    <aside class="w-64 bg-slate-900 text-slate-300 flex-col hidden md:flex shadow-2xl z-10">
        <div class="p-6 flex items-center gap-3 border-b border-slate-800">
            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-lg"><i class="fa-solid fa-pills text-xl"></i></div>
            <div><h1 class="text-lg font-bold text-white tracking-wide">Farmacorp</h1></div>
        </div>
        <nav class="flex-1 p-4 space-y-1 mt-4">
            <a href="app.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition"><i class="fa-solid fa-house w-5"></i> Inicio</a>
            <a href="productividad.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl shadow-md transition"><i class="fa-solid fa-chart-line w-5"></i> Productividad</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-10">
            <h2 class="text-xl font-bold text-slate-800">Reportes de Productividad</h2>
            <a href="productividad.html" class="text-sm text-purple-600 hover:text-purple-800 font-semibold flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Volver a Productividad
            </a>
        </header>

        <div class="p-6 md:p-10 flex-1 max-w-7xl mx-auto w-full">
            
            <!-- Filtros y Botón de Descarga -->
            <div class="card-premium p-6 rounded-2xl mb-8 flex flex-col md:flex-row gap-4 items-end">
                <div class="flex-1 w-full">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Desde</label>
                    <input type="date" id="fechaDesde" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none transition">
                </div>
                <div class="flex-1 w-full">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Hasta</label>
                    <input type="date" id="fechaHasta" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none transition">
                </div>
                <button id="btnFiltrar" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition shadow-lg shadow-purple-500/30 w-full md:w-auto flex items-center justify-center gap-2">
                    <i class="fa-solid fa-filter"></i> <span>Filtrar</span>
                </button>
                <button id="btnExcel" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3 px-6 rounded-xl transition shadow-lg shadow-emerald-500/30 w-full md:w-auto flex items-center justify-center gap-2">
                    <i class="fa-solid fa-file-excel"></i> <span>Excel</span>
                </button>
            </div>

            <div id="mensajeEstado" class="hidden text-center py-4 text-slate-500 font-bold text-lg"></div>

            <!-- Contenedores de Gráficos Premium -->
            <div id="contenedorGraficos" class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                
                <!-- Gráfico de Barras -->
                <div class="card-premium p-6 md:p-8 rounded-3xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-purple-50 rounded-bl-full -z-10"></div>
                    <h3 class="text-lg font-extrabold text-slate-800 mb-6 flex items-center gap-2 tracking-tight">
                        <i class="fa-solid fa-chart-bar text-purple-500"></i> SKU por Persona
                    </h3>
                    <div class="relative h-72 w-full">
                        <canvas id="graficoBarras"></canvas>
                    </div>
                </div>

                <!-- Gráfico de Torta -->
                <div class="card-premium p-6 md:p-8 rounded-3xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-blue-50 rounded-bl-full -z-10"></div>
                    <h3 class="text-lg font-extrabold text-slate-800 mb-6 flex items-center gap-2 tracking-tight">
                        <i class="fa-solid fa-chart-pie text-blue-500"></i> Distribución de SKU
                    </h3>
                    <div class="relative h-72 w-full flex justify-center">
                        <canvas id="graficoTorta"></canvas>
                    </div>
                </div>
            </div>

            <!-- TABLA DE RESULTADOS -->
            <div id="contenedorTabla" class="card-premium rounded-3xl overflow-hidden hidden">
                <div class="p-6 md:px-8 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="text-lg font-extrabold text-slate-800 tracking-tight">Cumplimiento de Metas</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50/50 text-slate-500 text-xs uppercase tracking-wider">
                                <th class="p-5 font-bold">Trabajador</th>
                                <th class="p-5 font-bold text-center">Meta Asignada</th>
                                <th class="p-5 font-bold text-center">SKU Logrados</th>
                                <th class="p-5 font-bold text-center">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaResultados">
                            <!-- Filas inyectadas por JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://wwurfjenenlvrhwakmso.supabase.co';
        const supabaseKey = 'sb_publishable_cn1zFLzla27K4l4EPltEbw_8YAgoq0C'; 
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let chartBarras = null;
        let chartTorta = null;
        let datosReporteGlobal = []; 

        // Configuración global de Chart.js para que se vea premium
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.color = '#64748b';
        Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(15, 23, 42, 0.9)';
        Chart.defaults.plugins.tooltip.titleFont = { size: 13, weight: 'bold' };
        Chart.defaults.plugins.tooltip.bodyFont = { size: 13 };
        Chart.defaults.plugins.tooltip.padding = 12;
        Chart.defaults.plugins.tooltip.cornerRadius = 8;
        Chart.defaults.plugins.tooltip.displayColors = false;

        // Fechas por defecto (últimos 7 días)
        const hoy = new Date();
        const hace7Dias = new Date();
        hace7Dias.setDate(hoy.getDate() - 7);
        
        document.getElementById('fechaDesde').value = hace7Dias.toISOString().split('T')[0];
        document.getElementById('fechaHasta').value = hoy.toISOString().split('T')[0];

        async function cargarReportes() {
            const desde = document.getElementById('fechaDesde').value;
            const hasta = document.getElementById('fechaHasta').value;
            
            const btn = document.getElementById('btnFiltrar');
            const msj = document.getElementById('mensajeEstado');
            const contGraficos = document.getElementById('contenedorGraficos');
            const contTabla = document.getElementById('contenedorTabla');

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Cargando...</span>';
            btn.disabled = true;
            msj.classList.add('hidden');
            contGraficos.classList.remove('hidden');
            contTabla.classList.add('hidden');

            // 1. Buscar las asignaciones de estas fechas
            const { data: asigs, error: errAsigs } = await _supabase
                .from('asignaciones')
                .select('id')
                .gte('fecha', desde)
                .lte('fecha', hasta);

            if (!asigs || asigs.length === 0) {
                btn.innerHTML = '<i class="fa-solid fa-filter"></i> <span>Filtrar</span>';
                btn.disabled = false;
                msj.innerHTML = `<i class="fa-solid fa-folder-open text-3xl mb-2 block"></i> No hay asignaciones en este rango de fechas.`;
                msj.classList.remove('hidden');
                contGraficos.classList.add('hidden');
                if (chartBarras) chartBarras.destroy();
                if (chartTorta) chartTorta.destroy();
                return;
            }

            const asigIds = asigs.map(a => a.id);

            // 2. Buscar la productividad SOLO de esas asignaciones
            const { data: prodData } = await _supabase
                .from('productividad')
                .select(`sku_revisados, operador_id, asignacion_id, usuarios (nombre)`)
                .in('asignacion_id', asigIds);

            // 3. Buscar las metas
            const { data: metasData } = await _supabase
                .from('asignacion_personal')
                .select('asignacion_id, operador_id, meta_del_dia')
                .in('asignacion_id', asigIds);

            btn.innerHTML = '<i class="fa-solid fa-filter"></i> <span>Filtrar</span>';
            btn.disabled = false;

            // Crear un "buscador" rápido de metas
            const mapaMetas = {};
            metasData.forEach(m => {
                mapaMetas[`${m.asignacion_id}-${m.operador_id}`] = m.meta_del_dia;
            });

            let resumen = {};
            
            // Cruzar los datos
            prodData.forEach(item => {
                if(item.usuarios && item.usuarios.nombre) {
                    let operadorId = item.operador_id;
                    let nombre = item.usuarios.nombre;
                    let sku = Number(item.sku_revisados);
                    let metaDelDia = mapaMetas[`${item.asignacion_id}-${operadorId}`] || 0;

                    if (!resumen[operadorId]) {
                        resumen[operadorId] = { nombre: nombre, sku: 0, meta: 0 };
                    }
                    // Sumamos los SKU y también SUMAMOS LAS METAS
                    resumen[operadorId].sku += sku;
                    resumen[operadorId].meta += metaDelDia; 
                }
            });

            datosReporteGlobal = Object.values(resumen);
            const nombres = datosReporteGlobal.map(d => d.nombre.split(' ')[0]);
            const cantidades = datosReporteGlobal.map(d => d.sku);

            if (nombres.length === 0) {
                msj.innerHTML = `<i class="fa-solid fa-folder-open text-3xl mb-2 block"></i> No hay datos de productividad en estas fechas.`;
                msj.classList.remove('hidden');
                contGraficos.classList.add('hidden');
                if (chartBarras) chartBarras.destroy();
                if (chartTorta) chartTorta.destroy();
                return;
            }

            // Llenar la Tabla
            const tbody = document.getElementById('tablaResultados');
            tbody.innerHTML = '';
            datosReporteGlobal.forEach(persona => {
                // Validar si cumplió con la meta sumada de todos los días
                const cumplio = persona.sku >= persona.meta && persona.meta > 0;
                
                let estadoBadge = '';
                if (persona.meta === 0) {
                    estadoBadge = `<span class="bg-slate-100 text-slate-500 px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-200">Sin meta</span>`;
                } else if (cumplio) {
                    estadoBadge = `<span class="bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-lg text-xs font-bold border border-emerald-100"><i class="fa-solid fa-check mr-1"></i> Cumplió</span>`;
                } else {
                    estadoBadge = `<span class="bg-rose-50 text-rose-600 px-3 py-1.5 rounded-lg text-xs font-bold border border-rose-100"><i class="fa-solid fa-xmark mr-1"></i> No cumplió</span>`;
                }

                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
                        <td class="p-5 font-semibold text-slate-800">${persona.nombre}</td>
                        <td class="p-5 text-center font-medium text-slate-600">${persona.meta} SKU</td>
                        <td class="p-5 text-center font-black text-blue-600 text-lg">${persona.sku} SKU</td>
                        <td class="p-5 text-center">${estadoBadge}</td>
                    </tr>
                `;
            });
            contTabla.classList.remove('hidden');

            // --- GRÁFICOS PREMIUM ---
            if (chartBarras) chartBarras.destroy();
            if (chartTorta) chartTorta.destroy();

            // Gráfico de Barras
            const ctxBarras = document.getElementById('graficoBarras').getContext('2d');
            const gradientBar = ctxBarras.createLinearGradient(0, 0, 0, 400);
            gradientBar.addColorStop(0, '#8b5cf6');
            gradientBar.addColorStop(1, '#6366f1');

            chartBarras = new Chart(ctxBarras, {
                type: 'bar',
                data: { labels: nombres, datasets: [{ label: 'SKU Revisados', data: cantidades, backgroundColor: gradientBar, borderRadius: 8, borderSkipped: false, barPercentage: 0.6 }] },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: (context) => ' SKU: ' + context.raw } } }, 
                    scales: { x: { grid: { display: false, drawBorder: false } }, y: { beginAtZero: true, grid: { color: '#f1f5f9', drawBorder: false, borderDash: [5, 5] }, ticks: { stepSize: 500 } } } 
                }
            });

            // Gráfico de Torta
            const ctxTorta = document.getElementById('graficoTorta').getContext('2d');
            chartTorta = new Chart(ctxTorta, {
                type: 'doughnut',
                data: { labels: nombres, datasets: [{ data: cantidades, backgroundColor: ['#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#ec4899'], borderWidth: 4, borderColor: '#ffffff', hoverOffset: 8 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, padding: 20, font: { size: 12, weight: '600'} } }, tooltip: { callbacks: { label: (context) => ' ' + context.label + ': ' + context.raw + ' SKU' } } } }
            });
        }

        // Descargar Excel
        document.getElementById('btnExcel').addEventListener('click', () => {
            if (datosReporteGlobal.length === 0) return alert('No hay datos para exportar.');
            const excelData = datosReporteGlobal.map(p => ({ 'Trabajador': p.nombre, 'Meta Asignada': p.meta, 'SKU Logrados': p.sku, 'Cumplió Meta': p.meta > 0 ? (p.sku >= p.meta ? 'SÍ' : 'NO') : 'Sin Meta' }));
            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Reporte Productividad");
            XLSX.writeFile(wb, `Reporte_Productividad_${new Date().toISOString().split('T')[0]}.xlsx`);
        });

        document.getElementById('btnFiltrar').addEventListener('click', cargarReportes);
        cargarReportes();
    </script>
</body>
</html>
