<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Farmacorp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        body { font-family: 'Inter', sans-serif; } 
        .card-premium { 
            background: #ffffff; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); 
            border: 1px solid #f1f5f9; 
        }
        /* Transición suave para la flechita */
        .chevron-rotate { transition: transform 0.3s ease; }
        .rotate-180 { transform: rotate(180deg); }
    </style>
</head>
<body class="bg-slate-50 font-sans h-screen flex overflow-hidden">

    <!-- Menú Lateral -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex-col hidden md:flex shadow-2xl z-20">
        <div class="p-6 flex items-center gap-3 border-b border-slate-800">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30"><i class="fa-solid fa-pills text-lg"></i></div>
            <div><h1 class="text-lg font-bold text-white tracking-tight">Farmacorp</h1></div>
        </div>
        <nav class="flex-1 p-4 space-y-1 mt-4">
            <a href="app.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition font-medium"><i class="fa-solid fa-house w-5"></i> Inicio</a>
            <a href="productividad.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl shadow-md transition font-medium"><i class="fa-solid fa-chart-line w-5"></i> Productividad</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <!-- Cabecera -->
        <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-10 border-b border-slate-100">
            <h2 class="text-xl font-bold text-slate-800 tracking-tight">Reportes de Productividad</h2>
            <a href="productividad.html" class="text-sm text-purple-600 hover:text-purple-800 font-semibold flex items-center gap-2 bg-purple-50 px-3 py-2 rounded-lg transition">
                <i class="fa-solid fa-arrow-left"></i> Volver
            </a>
        </header>

        <div class="p-4 md:p-8 flex-1 max-w-7xl mx-auto w-full">
            
            <!-- ACORDEÓN DE FILTROS -->
            <div class="mb-6 relative z-20">
                <!-- Barra para abrir/cerrar -->
                <button id="toggleFiltrosBtn" class="w-full bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center text-slate-700 font-bold hover:bg-slate-50 transition mb-3">
                    <span class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center">
                            <i class="fa-solid fa-sliders"></i>
                        </div>
                        Filtros de búsqueda
                    </span>
                    <i id="iconoFlecha" class="fa-solid fa-chevron-up text-slate-400 chevron-rotate rotate-180"></i>
                </button>

                <!-- Contenedor de Filtros (Oculto por defecto) -->
                <div id="panelFiltros" class="hidden card-premium p-5 rounded-2xl">
                    <div class="grid grid-cols-2 lg:grid-cols-12 gap-3 md:gap-4 items-end">
                        
                        <div class="col-span-1 lg:col-span-2">
                            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Desde</label>
                            <input type="date" id="fechaDesde" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 outline-none transition text-slate-700">
                        </div>
                        <div class="col-span-1 lg:col-span-2">
                            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Hasta</label>
                            <input type="date" id="fechaHasta" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 outline-none transition text-slate-700">
                        </div>

                        <div class="col-span-2 lg:col-span-3 relative" id="multiSelectContainer">
                            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Trabajadores</label>
                            <button type="button" id="btnDropdown" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 outline-none transition font-medium text-slate-700 flex justify-between items-center">
                                <span id="textoDropdown" class="truncate">Todos</span>
                                <i class="fa-solid fa-chevron-down text-slate-400 text-xs"></i>
                            </button>
                            <div id="listaCheckboxes" class="hidden absolute z-30 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-xl max-h-60 overflow-y-auto p-2">
                                <label class="flex items-center gap-2 p-2 hover:bg-slate-50 rounded cursor-pointer border-b border-slate-100 mb-1">
                                    <input type="checkbox" id="checkTodos" checked class="w-4 h-4 text-purple-600 rounded border-slate-300 focus:ring-purple-500">
                                    <span class="font-bold text-sm text-slate-800">Seleccionar Todos</span>
                                </label>
                                <div id="contenedorOpciones"></div>
                            </div>
                        </div>

                        <div class="col-span-2 lg:col-span-2">
                            <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Estado de Meta</label>
                            <select id="filtroCumplimiento" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 outline-none transition font-medium text-slate-700">
                                <option value="todos">Todos</option>
                                <option value="cumplieron">✅ Cumplieron</option>
                                <option value="no_cumplieron">❌ No cumplieron</option>
                            </select>
                        </div>

                        <div class="col-span-2 lg:col-span-3 flex gap-2 w-full mt-2 lg:mt-0">
                            <button id="btnFiltrar" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 px-4 rounded-lg transition shadow-sm text-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-filter"></i> Filtrar
                            </button>
                            <button id="btnExcel" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-lg transition shadow-sm text-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-file-excel"></i> Excel
                            </button>
                        </div>

                    </div>
                </div>
            </div>

            <div id="mensajeEstado" class="hidden text-center py-4 text-slate-500 font-bold text-lg"></div>

            <!-- Gráficos -->
            <div id="contenedorGraficos" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                <div class="card-premium p-5 md:p-6 rounded-2xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-purple-50 rounded-bl-full -z-10 opacity-50"></div>
                    <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-chart-bar text-purple-500"></i> SKU por Persona
                    </h3>
                    <div class="relative h-64 w-full"><canvas id="graficoBarras"></canvas></div>
                </div>

                <div class="card-premium p-5 md:p-6 rounded-2xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-blue-50 rounded-bl-full -z-10 opacity-50"></div>
                    <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-blue-500"></i> Distribución de SKU
                    </h3>
                    <div class="relative h-64 w-full flex justify-center"><canvas id="graficoTorta"></canvas></div>
                </div>
            </div>

            <!-- Tabla -->
            <div id="contenedorTabla" class="card-premium rounded-2xl overflow-hidden hidden">
                <div class="p-5 border-b border-slate-100">
                    <h3 class="text-base font-bold text-slate-800">Cumplimiento de Metas</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wider">
                                <th class="p-4 font-bold">Trabajador</th>
                                <th class="p-4 font-bold text-center">Meta Asignada</th>
                                <th class="p-4 font-bold text-center">SKU Logrados</th>
                                <th class="p-4 font-bold text-center">Faltante</th>
                                <th class="p-4 font-bold text-center">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaResultados" class="text-sm"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://wwurfjenenlvrhwakmso.supabase.co';
        const supabaseKey = 'sb_publishable_cn1zFLzla27K4l4EPltEbw_8YAgoq0C'; 
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let chartBarras = null;
        let chartTorta = null;
        let datosReporteGlobal = []; 

        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.color = '#64748b';
        Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(15, 23, 42, 0.9)';
        Chart.defaults.plugins.tooltip.titleFont = { size: 13, weight: 'bold' };
        Chart.defaults.plugins.tooltip.bodyFont = { size: 13 };
        Chart.defaults.plugins.tooltip.padding = 12;
        Chart.defaults.plugins.tooltip.cornerRadius = 8;
        Chart.defaults.plugins.tooltip.displayColors = false;

        const hoy = new Date();
        const hace7Dias = new Date();
        hace7Dias.setDate(hoy.getDate() - 7);
        document.getElementById('fechaDesde').value = hace7Dias.toISOString().split('T')[0];
        document.getElementById('fechaHasta').value = hoy.toISOString().split('T')[0];

        // --- LÓGICA DE ABRIR/CERRAR FILTROS (ACORDEÓN) ---
        const toggleFiltrosBtn = document.getElementById('toggleFiltrosBtn');
        const panelFiltros = document.getElementById('panelFiltros');
        const iconoFlecha = document.getElementById('iconoFlecha');

        toggleFiltrosBtn.addEventListener('click', () => {
            panelFiltros.classList.toggle('hidden');
            iconoFlecha.classList.toggle('rotate-180');
        });

        // --- LÓGICA DEL MULTI-SELECT ---
        const btnDropdown = document.getElementById('btnDropdown');
        const listaCheckboxes = document.getElementById('listaCheckboxes');
        const checkTodos = document.getElementById('checkTodos');
        const contenedorOpciones = document.getElementById('contenedorOpciones');
        const textoDropdown = document.getElementById('textoDropdown');

        btnDropdown.addEventListener('click', () => listaCheckboxes.classList.toggle('hidden'));

        document.addEventListener('click', (e) => {
            if (!document.getElementById('multiSelectContainer').contains(e.target)) {
                listaCheckboxes.classList.add('hidden');
            }
        });

        checkTodos.addEventListener('change', (e) => {
            document.querySelectorAll('.check-persona').forEach(chk => chk.checked = e.target.checked);
            actualizarTextoDropdown();
            actualizarVista();
        });

        function actualizarTextoDropdown() {
            const checkboxes = document.querySelectorAll('.check-persona');
            const seleccionados = Array.from(checkboxes).filter(chk => chk.checked);
            
            if (seleccionados.length === 0) textoDropdown.innerText = "Ninguno";
            else if (seleccionados.length === checkboxes.length) textoDropdown.innerText = "Todos";
            else textoDropdown.innerText = `${seleccionados.length} seleccionados`;
        }

        document.getElementById('filtroCumplimiento').addEventListener('change', actualizarVista);

        // --- CARGA DE DATOS ---
        async function cargarReportes() {
            // Ocultar filtros automáticamente al filtrar para dar más espacio
            panelFiltros.classList.add('hidden');
            iconoFlecha.classList.add('rotate-180');

            const desde = document.getElementById('fechaDesde').value;
            const hasta = document.getElementById('fechaHasta').value;
            
            const btn = document.getElementById('btnFiltrar');
            const msj = document.getElementById('mensajeEstado');
            const contGraficos = document.getElementById('contenedorGraficos');
            const contTabla = document.getElementById('contenedorTabla');

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Cargando...';
            btn.disabled = true;
            msj.classList.add('hidden');
            contGraficos.classList.remove('hidden');
            contTabla.classList.add('hidden');

            const { data: asigs } = await _supabase.from('asignaciones').select('id').gte('fecha', desde).lte('fecha', hasta);

            if (!asigs || asigs.length === 0) {
                btn.innerHTML = '<i class="fa-solid fa-filter"></i> Filtrar';
                btn.disabled = false;
                msj.innerHTML = `<i class="fa-solid fa-folder-open text-3xl mb-2 block"></i> No hay asignaciones en este rango.`;
                msj.classList.remove('hidden');
                contGraficos.classList.add('hidden');
                if (chartBarras) chartBarras.destroy();
                if (chartTorta) chartTorta.destroy();
                return;
            }

            const asigIds = asigs.map(a => a.id);

            const { data: prodData } = await _supabase.from('productividad').select(`sku_revisados, operador_id, asignacion_id, usuarios (nombre)`).in('asignacion_id', asigIds);
            const { data: metasData } = await _supabase.from('asignacion_personal').select('asignacion_id, operador_id, meta_del_dia').in('asignacion_id', asigIds);

            btn.innerHTML = '<i class="fa-solid fa-filter"></i> Filtrar';
            btn.disabled = false;

            const mapaMetas = {};
            metasData.forEach(m => mapaMetas[`${m.asignacion_id}-${m.operador_id}`] = m.meta_del_dia);

            let resumen = {};
            prodData.forEach(item => {
                if(item.usuarios && item.usuarios.nombre) {
                    let operadorId = item.operador_id;
                    let nombre = item.usuarios.nombre;
                    let sku = Number(item.sku_revisados);
                    let metaDelDia = mapaMetas[`${item.asignacion_id}-${operadorId}`] || 0;

                    if (!resumen[operadorId]) resumen[operadorId] = { nombre: nombre, sku: 0, meta: 0 };
                    resumen[operadorId].sku += sku;
                    resumen[operadorId].meta += metaDelDia; 
                }
            });

            datosReporteGlobal = Object.values(resumen);

            if (datosReporteGlobal.length === 0) {
                msj.innerHTML = `<i class="fa-solid fa-folder-open text-3xl mb-2 block"></i> No hay datos en estas fechas.`;
                msj.classList.remove('hidden');
                contGraficos.classList.add('hidden');
                if (chartBarras) chartBarras.destroy();
                if (chartTorta) chartTorta.destroy();
                return;
            }

            // Generar Checkboxes
            contenedorOpciones.innerHTML = '';
            datosReporteGlobal.sort((a,b) => a.nombre.localeCompare(b.nombre)).forEach(d => {
                contenedorOpciones.innerHTML += `
                    <label class="flex items-center gap-2 p-2 hover:bg-slate-50 rounded cursor-pointer">
                        <input type="checkbox" value="${d.nombre}" class="check-persona w-4 h-4 text-purple-600 rounded border-slate-300 focus:ring-purple-500" checked>
                        <span class="text-sm text-slate-700">${d.nombre}</span>
                    </label>
                `;
            });

            document.querySelectorAll('.check-persona').forEach(chk => {
                chk.addEventListener('change', () => {
                    checkTodos.checked = Array.from(document.querySelectorAll('.check-persona')).every(c => c.checked);
                    actualizarTextoDropdown();
                    actualizarVista();
                });
            });

            checkTodos.checked = true;
            actualizarTextoDropdown();
            actualizarVista();
        }

        function obtenerDatosFiltrados() {
            const checkboxes = document.querySelectorAll('.check-persona');
            const seleccionados = Array.from(checkboxes).filter(chk => chk.checked).map(chk => chk.value);
            const filtroCumplimiento = document.getElementById('filtroCumplimiento').value;

            let datosMostrar = datosReporteGlobal;

            if (seleccionados.length > 0 && seleccionados.length < checkboxes.length) {
                datosMostrar = datosMostrar.filter(d => seleccionados.includes(d.nombre));
            }

            if (filtroCumplimiento === 'cumplieron') {
                datosMostrar = datosMostrar.filter(d => d.meta > 0 && d.sku >= d.meta);
            } else if (filtroCumplimiento === 'no_cumplieron') {
                datosMostrar = datosMostrar.filter(d => d.meta > 0 && d.sku < d.meta);
            }

            return datosMostrar;
        }

        function actualizarVista() {
            const datosMostrar = obtenerDatosFiltrados();
            
            if (datosMostrar.length === 0) {
                document.getElementById('mensajeEstado').innerHTML = `<i class="fa-solid fa-magnifying-glass text-3xl mb-2 block"></i> No hay trabajadores que coincidan.`;
                document.getElementById('mensajeEstado').classList.remove('hidden');
                document.getElementById('contenedorGraficos').classList.add('hidden');
                document.getElementById('contenedorTabla').classList.add('hidden');
                if (chartBarras) chartBarras.destroy();
                if (chartTorta) chartTorta.destroy();
                return;
            } else {
                document.getElementById('mensajeEstado').classList.add('hidden');
                document.getElementById('contenedorGraficos').classList.remove('hidden');
                document.getElementById('contenedorTabla').classList.remove('hidden');
            }

            const nombres = datosMostrar.map(d => d.nombre.split(' ')[0]);
            const cantidades = datosMostrar.map(d => d.sku);

            const tbody = document.getElementById('tablaResultados');
            tbody.innerHTML = '';
            
            datosMostrar.forEach(persona => {
                const cumplio = persona.sku >= persona.meta && persona.meta > 0;
                let faltante = persona.meta - persona.sku;
                let textoFaltante = persona.meta === 0 ? '<span class="text-slate-400">-</span>' : 
                                    (faltante > 0 ? `<span class="font-bold text-rose-500">${faltante}</span>` : `<span class="font-bold text-emerald-500">0</span>`);

                let estadoBadge = '';
                if (persona.meta === 0) {
                    estadoBadge = `<span class="bg-slate-100 text-slate-500 px-2 py-1 rounded text-xs font-bold">Sin meta</span>`;
                } else if (cumplio) {
                    estadoBadge = `<span class="bg-emerald-50 text-emerald-600 px-2 py-1 rounded text-xs font-bold border border-emerald-100"><i class="fa-solid fa-check mr-1"></i> Cumplió</span>`;
                } else {
                    estadoBadge = `<span class="bg-rose-50 text-rose-600 px-2 py-1 rounded text-xs font-bold border border-rose-100"><i class="fa-solid fa-xmark mr-1"></i> No cumplió</span>`;
                }

                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
                        <td class="p-4 font-semibold text-slate-800">${persona.nombre}</td>
                        <td class="p-4 text-center font-medium text-slate-600">${persona.meta} SKU</td>
                        <td class="p-4 text-center font-black text-blue-600">${persona.sku} SKU</td>
                        <td class="p-4 text-center">${textoFaltante}</td>
                        <td class="p-4 text-center">${estadoBadge}</td>
                    </tr>
                `;
            });

            if (chartBarras) chartBarras.destroy();
            if (chartTorta) chartTorta.destroy();

            const ctxBarras = document.getElementById('graficoBarras').getContext('2d');
            const gradientBar = ctxBarras.createLinearGradient(0, 0, 0, 300);
            gradientBar.addColorStop(0, '#8b5cf6');
            gradientBar.addColorStop(1, '#6366f1');

            chartBarras = new Chart(ctxBarras, {
                type: 'bar',
                data: { labels: nombres, datasets: [{ label: 'SKU', data: cantidades, backgroundColor: gradientBar, borderRadius: 6, barPercentage: 0.6 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { borderDash: [5, 5] } } } }
            });

            const ctxTorta = document.getElementById('graficoTorta').getContext('2d');
            chartTorta = new Chart(ctxTorta, {
                type: 'doughnut',
                data: { labels: nombres, datasets: [{ data: cantidades, backgroundColor: ['#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ef4444'], borderWidth: 3, borderColor: '#ffffff', hoverOffset: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 6, padding: 15, font: { size: 11 } } } } }
            });
        }

        // Descargar Excel
        document.getElementById('btnExcel').addEventListener('click', async () => {
            const datosAExportar = obtenerDatosFiltrados();
            if (datosAExportar.length === 0) return alert('No hay datos para exportar.');
            
            const btn = document.getElementById('btnExcel');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>...';
            btn.disabled = true;

            try {
                const workbook = new ExcelJS.Workbook();
                const worksheet = workbook.addWorksheet('Reporte');

                worksheet.columns = [
                    { header: 'Trabajador', key: 'nombre', width: 30 },
                    { header: 'Meta Asignada', key: 'meta', width: 15 },
                    { header: 'SKU Logrados', key: 'sku', width: 15 },
                    { header: 'SKU Faltantes', key: 'faltante', width: 15 },
                    { header: 'Cumplió Meta', key: 'cumplio', width: 15 }
                ];

                const headerRow = worksheet.getRow(1);
                headerRow.font = { bold: true, color: { argb: 'FFFFFFFF' } };
                headerRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF4F46E5' } };
                headerRow.alignment = { vertical: 'middle', horizontal: 'center' };
                headerRow.height = 25;

                datosAExportar.forEach(p => {
                    let faltante = p.meta - p.sku;
                    let txtFaltante = faltante > 0 ? faltante : 0;
                    let cumplioText = p.meta > 0 ? (p.sku >= p.meta ? 'SÍ' : 'NO') : 'Sin Meta';

                    const row = worksheet.addRow({
                        nombre: p.nombre,
                        meta: p.meta,
                        sku: p.sku,
                        faltante: p.meta > 0 ? txtFaltante : 'N/A',
                        cumplio: cumplioText
                    });

                    row.getCell('meta').alignment = { horizontal: 'center' };
                    row.getCell('sku').alignment = { horizontal: 'center' };
                    row.getCell('faltante').alignment = { horizontal: 'center' };
                    row.getCell('cumplio').alignment = { horizontal: 'center' };

                    if (cumplioText === 'SÍ') row.getCell('cumplio').font = { color: { argb: 'FF16A34A' }, bold: true };
                    else if (cumplioText === 'NO') row.getCell('cumplio').font = { color: { argb: 'FFDC2626' }, bold: true };
                });

                worksheet.eachRow((row) => row.eachCell((cell) => cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } }));

                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Reporte_${new Date().toISOString().split('T')[0]}.xlsx`;
                a.click();
                window.URL.revokeObjectURL(url);

            } catch (error) {
                console.error(error);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-file-excel"></i> Excel';
                btn.disabled = false;
            }
        });

        document.getElementById('btnFiltrar').addEventListener('click', cargarReportes);
        
        // Iniciar (Al cargar la página por primera vez, se muestran los filtros un momento y se contraen)
        setTimeout(() => {
            cargarReportes();
        }, 100);
    </script>
</body>
</html>
