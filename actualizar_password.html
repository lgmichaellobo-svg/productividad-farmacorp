<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - Farmacorp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center font-sans">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md mx-4">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-extrabold text-slate-800">Crea tu nueva contraseña</h2>
            <p class="text-sm text-slate-500 mt-2">Ingresa tu nueva contraseña para recuperar el acceso.</p>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-bold text-slate-700 mb-2">Nueva Contraseña</label>
            <input type="password" id="newPassword" class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-blue-500 outline-none font-bold text-slate-800" placeholder="••••••••">
        </div>

        <button id="btnActualizar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-500/30">
            Actualizar Contraseña
        </button>
        
        <div id="mensaje" class="mt-4 text-center text-sm font-bold hidden p-3 rounded-lg"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://wwurfjenenlvrhwakmso.supabase.co';
        const supabaseKey = 'sb_publishable_cn1zFLzla27K4l4EPltEbw_8YAgoq0C'; 
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('btnActualizar').addEventListener('click', async () => {
            const password = document.getElementById('newPassword').value;
            const msj = document.getElementById('mensaje');
            const btn = document.getElementById('btnActualizar');

            if (password.length < 6) {
                msj.innerText = "La contraseña debe tener al menos 6 caracteres.";
                msj.className = 'mt-4 text-center text-sm font-bold block p-3 rounded-lg bg-rose-100 text-rose-700';
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Actualizando...';
            btn.disabled = true;

            const { error } = await _supabase.auth.updateUser({ password: password });

            if (error) {
                msj.innerText = "Error: " + error.message;
                msj.className = 'mt-4 text-center text-sm font-bold block p-3 rounded-lg bg-rose-100 text-rose-700';
                btn.innerHTML = 'Actualizar Contraseña';
                btn.disabled = false;
            } else {
                msj.innerText = "¡Contraseña actualizada! Redirigiendo al inicio...";
                msj.className = 'mt-4 text-center text-sm font-bold block p-3 rounded-lg bg-emerald-100 text-emerald-700';
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            }
        });
    </script>
</body>
</html>
