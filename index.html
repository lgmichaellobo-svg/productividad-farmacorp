<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Farmacorp</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>Prueba de Conexión</h2>
    <button onclick="probarConexion()" style="padding: 10px 20px; background: blue; color: white; border: none; cursor: pointer;">
        Hacer clic para probar
    </button>
    <p id="resultado" style="margin-top: 20px; font-weight: bold;"></p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        async function probarConexion() {
            const resultado = document.getElementById('resultado');
            resultado.innerText = "Conectando...";

            try {
                // URL CORRECTA CON LA LETRA "F"
                const supabaseUrl = 'https://wwurfjenenlvrhwakmso.supabase.co';
                
                // PEGA AQUÍ TU LLAVE PUBLISHABLE (la que empieza con sb_publishable)
                const supabaseKey = 'sb_publishable_cn1zFLzla27K4l4EPltEbw_8YAgoq0C'; 

                const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
                const { data, error } = await supabase.from('tipos_negocio').select('*');

                if (error) {
                    resultado.style.color = 'red';
                    resultado.innerText = 'Error de Supabase: ' + error.message;
                } else {
                    resultado.style.color = 'green';
                    resultado.innerText = '¡CONEXIÓN EXITOSA! Datos: ' + JSON.stringify(data);
                }
            } catch (err) {
                resultado.style.color = 'red';
                resultado.innerText = 'Error de red: ' + err.message;
            }
        }
    </script>
</body>
</html>
