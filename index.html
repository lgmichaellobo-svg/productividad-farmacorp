<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farma - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; } 
    </style>
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md mx-4 relative overflow-hidden">
        <!-- Adorno superior -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-600 to-blue-400"></div>

        <div class="text-center mb-8 mt-2">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm">
                <i class="fa-solid fa-pills text-3xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Farma</h1>
            <p class="text-sm text-slate-500 mt-1 font-medium">Sistema Interno de Inventario</p>
        </div>

        <!-- Pestañas de Login / Registro -->
        <div class="flex bg-slate-100 rounded-xl p-1 mb-6">
            <button id="tabLogin" class="flex-1 py-2 rounded-lg text-sm font-bold bg-white text-blue-600 shadow-sm transition">Iniciar Sesión</button>
            <button id="tabRegistro" class="flex-1 py-2 rounded-lg text-sm font-bold text-slate-500 hover:text-slate-700 transition">Crear Cuenta</button>
        </div>

        <!-- FORMULARIO DE LOGIN -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Correo Electrónico</label>
                <input type="email" id="loginEmail" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="tu@correo.com">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Contraseña</label>
                <input type="password" id="loginPassword" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="••••••••">
            </div>
            <button type="submit" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-blue-500/30 mt-2">
                Ingresar al Sistema
            </button>
        </form>

        <!-- FORMULARIO DE REGISTRO (Oculto por defecto) -->
        <form id="registroForm" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Nombre Completo</label>
                <input type="text" id="regNombre" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition uppercase" placeholder="Ej. JUAN PEREZ">
                <p class="text-[10px] text-slate-500 mt-1">Escríbelo igual que en tu Excel de trabajo.</p>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Correo Electrónico</label>
                <input type="email" id="regEmail" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="tu@correo.com">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1.5">Contraseña</label>
                <input type="password" id="regPassword" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Crea una contraseña segura">
            </div>
            <button type="submit" id="btnRegistro" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-orange-500/30 mt-2">
                Registrarme
            </button>
        </form>

        <div id="mensaje" class="mt-5 text-center text-sm font-bold hidden p-3 rounded-lg"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://wwurfjenenlvrhwakmso.supabase.co';
        const supabaseKey = 'sb_publishable_cn1zFLzla27K4l4EPltEbw_8YAgoq0C'; 
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const tabLogin = document.getElementById('tabLogin');
        const tabRegistro = document.getElementById('tabRegistro');
        const formLogin = document.getElementById('loginForm');
        const formRegistro = document.getElementById('registroForm');
        const msg = document.getElementById('mensaje');

        // Cambiar entre pestañas
        tabLogin.addEventListener('click', () => {
            tabLogin.className = 'flex-1 py-2 rounded-lg text-sm font-bold bg-white text-blue-600 shadow-sm transition';
            tabRegistro.className = 'flex-1 py-2 rounded-lg text-sm font-bold text-slate-500 hover:text-slate-700 transition';
            formLogin.classList.remove('hidden');
            formRegistro.classList.add('hidden');
            msg.classList.add('hidden');
        });

        tabRegistro.addEventListener('click', () => {
            tabRegistro.className = 'flex-1 py-2 rounded-lg text-sm font-bold bg-white text-blue-600 shadow-sm transition';
            tabLogin.className = 'flex-1 py-2 rounded-lg text-sm font-bold text-slate-500 hover:text-slate-700 transition';
            formRegistro.classList.remove('hidden');
            formLogin.classList.add('hidden');
            msg.classList.add('hidden');
        });

        // Lógica de Iniciar Sesión (CON VALIDACIÓN DE PERFIL)
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Ingresando...';
            btn.disabled = true;
            msg.classList.add('hidden');

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            // 1. Autenticar con Supabase Auth
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                msg.innerText = 'Error: ' + (error.message === 'Invalid login credentials' ? 'Correo o contraseña incorrectos' : error.message);
                msg.className = 'mt-5 text-center text-sm font-bold block p-3 rounded-lg bg-rose-100 text-rose-700';
                btn.innerHTML = 'Ingresar al Sistema';
                btn.disabled = false;
                return;
            }

            // 2. Verificar si el correo ya tiene un perfil vinculado en la tabla 'usuarios'
            const { data: usuarioDB, error: errorDB } = await _supabase
                .from('usuarios')
                .select('nombre')
                .eq('email', email)
                .single();

            if (usuarioDB) {
                // El perfil ya está vinculado, entra normal
                msg.innerText = '¡Bienvenido ' + usuarioDB.nombre + '! Redirigiendo...';
                msg.className = 'mt-5 text-center text-sm font-bold block p-3 rounded-lg bg-emerald-100 text-emerald-700';
                window.location.href = 'app.html';
            } else {
                // Es un usuario nuevo (correo no vinculado a un nombre). 
                // Lo mandamos a app.html, donde el modal de vinculación se activará solo.
                msg.innerText = 'Ingresando por primera vez. Redirigiendo para vincular tu nombre...';
                msg.className = 'mt-5 text-center text-sm font-bold block p-3 rounded-lg bg-blue-100 text-blue-700';
                window.location.href = 'app.html';
            }
        });

        // Lógica de Registro
        formRegistro.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnRegistro');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creando cuenta...';
            btn.disabled = true;
            msg.classList.add('hidden');

            const nombre = document.getElementById('regNombre').value.toUpperCase();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            // 1. Crear el usuario en el sistema de Auth
            const { data: authData, error: authError } = await _supabase.auth.signUp({ email, password });

            if (authError) {
                msg.innerText = 'Error al crear cuenta: ' + authError.message;
                msg.className = 'mt-5 text-center text-sm font-bold block p-3 rounded-lg bg-rose-100 text-rose-700';
                btn.innerHTML = 'Registrarme';
                btn.disabled = false;
                return;
            }

            // 2. Vincular el nombre en la tabla 'usuarios'
            if (authData.user) {
                const nuevoId = authData.user.id;

                // Verificamos si el nombre ya existe en la tabla (pre-cargado por el admin)
                const { data: usuarioExistente } = await _supabase
                    .from('usuarios')
                    .select('id')
                    .eq('nombre', nombre)
                    .single();

                if (usuarioExistente) {
                    // Si el nombre existe (ej. "MICHAEL LOBO"), actualizamos ese registro con su nuevo correo e ID de auth
                    await _supabase.from('usuarios').update({ 
                        id: nuevoId,
                        email: email 
                    }).eq('id', usuarioExistente.id);
                } else {
                    // Si no existe, lo creamos como nuevo (mixto por defecto)
                    await _supabase.from('usuarios').insert([{
                        id: nuevoId,
                        nombre: nombre,
                        email: email,
                        rol: 'mixto' 
                    }]);
                }

                msg.innerText = '¡Cuenta creada con éxito! Ya puedes iniciar sesión.';
                msg.className = 'mt-5 text-center text-sm font-bold block p-3 rounded-lg bg-emerald-100 text-emerald-700';
                btn.innerHTML = 'Registrarme';
                btn.disabled = false;
                
                // Limpiar formulario y pasarlo a la pestaña de Login
                formRegistro.reset();
                setTimeout(() => { tabLogin.click(); }, 2000);
            }
        });
    </script>
</body>
</html>
