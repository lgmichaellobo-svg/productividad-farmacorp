<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Asignación - Farma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; } 
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        
        /* Animaciones */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.4s ease-out forwards; }
        
        /* Scrollbar personalizada */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 font-sans h-screen flex overflow-hidden">

    <aside class="w-64 bg-slate-900 text-slate-300 flex-col hidden md:flex shadow-2xl z-20 relative flex-shrink-0 border-r border-slate-800">
        <div class="p-6 flex items-center gap-3 border-b border-slate-800">
            <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-blue-400 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/40">
                <i class="fa-solid fa-pills text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-extrabold text-white tracking-tight">Farma</h1>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-1.5 mt-2 overflow-y-auto">
            <a href="app.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition font-semibold text-sm"><i class="fa-solid fa-house w-5 text-center"></i> Inicio</a>
            <a href="productividad.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600/10 text-blue-400 border border-blue-500/20 rounded-xl transition font-bold text-sm"><i class="fa-solid fa-chart-line w-5 text-center"></i> Productividad</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto relative">
        <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-blue-50/70 to-slate-50 -z-10"></div>

        <header class="glass-effect sticky top-0 z-10 px-6 py-4 flex justify-between items-center border-b border-slate-200/60 shadow-sm">
            <h2 class="text-xl font-extrabold text-slate-800 tracking-tight">Nueva Asignación</h2>
            <a href="productividad.html" class="text-sm text-slate-500 hover:text-blue-700 font-bold flex items-center gap-2 bg-white border border-slate-200 px-4 py-2.5 rounded-xl transition shadow-sm">
                <i class="fa-solid fa-arrow-left"></i> Volver
            </a>
        </header>

        <div class="p-4 md:p-8 flex-1 max-w-5xl mx-auto w-full">
            <form id="formAsignacion" class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 animate-fade-up">
                
                <h3 class="text-lg font-extrabold text-slate-800 mb-6 border-b border-slate-100 pb-4 flex items-center gap-2">
                    <i class="fa-solid fa-calendar-check text-blue-500"></i> Datos de la Jornada
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Fecha</label>
                        <input type="date" id="fechaAsig" required class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none font-bold text-slate-800 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Encargado</label>
                        <select id="encargadoAsig" required class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none font-bold text-slate-800 transition">
                            <option value="">Cargando personal...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Bodega / Sucursal</label>
                        <select id="bodegaAsig" required class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none font-bold text-slate-800 transition">
                            <option value="">Cargando bodegas...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Tipo de Negocio</label>
                        <select id="negocioAsig" required class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none font-bold text-slate-800 transition">
                            <option value="">Cargando negocios...</option>
                        </select>
                    </div>
                </div>
                
                <div class="mb-8">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-3 gap-3">
                        <label class="block text-sm font-bold text-slate-700">Asistentes (Equipo de trabajo)</label>
                        <!-- BUSCADOR DE PERSONAL -->
                        <div class="relative w-full md:w-64">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input type="text" id="buscadorPersonal" placeholder="Buscar persona..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>
                    </div>
                    
                    <div id="listaAsistentes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 border border-slate-200 p-4 rounded-2xl max-h-72 overflow-y-auto bg-slate-50 custom-scrollbar">
                        <p class="text-sm text-slate-500 col-span-full text-center py-4 font-medium">Cargando personal...</p>
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-extrabold py-4 rounded-2xl transition-all shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2 text-lg">
                    <i class="fa-solid fa-save"></i> Guardar Asignación
                </button>
            </form>
            <div id="mensaje" class="mt-4 text-center font-bold hidden p-4 rounded-xl animate-fade-up"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://wwurfjenenlvrhwakmso.supabase.co';
        const supabaseKey = 'sb_publishable_cn1zFLzla27K4l4EPltEbw_8YAgoq0C'; 
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let todosLosAsistentes = []; // Guardaremos la lista completa para el buscador

        async function cargarDatos() {
            // 1. Cargar Encargados
            const { data: encargados } = await _supabase
                .from('usuarios')
                .select('id, nombre, rol')
                .in('rol', ['encargado', 'mixto', 'admin', 'jefe', 'supervisor'])
                .order('nombre');
            
            if (encargados) {
                const select = document.getElementById('encargadoAsig');
                select.innerHTML = '<option value="">Seleccione...</option>';
                encargados.forEach(u => select.innerHTML += `<option value="${u.id}">${u.nombre}</option>`);
            }

            // 2. Cargar Bodegas
            const { data: bodegas } = await _supabase.from('bodegas').select('id, nombre').order('nombre');
            if (bodegas) {
                const select = document.getElementById('bodegaAsig');
                select.innerHTML = '<option value="">Seleccione...</option>';
                bodegas.forEach(b => select.innerHTML += `<option value="${b.id}">${b.nombre}</option>`);
            }

            // 3. Cargar Negocios
            const { data: negocios } = await _supabase.from('tipos_negocio').select('id, nombre');
            if (negocios) {
                const select = document.getElementById('negocioAsig');
                select.innerHTML = '<option value="">Seleccione...</option>';
                negocios.forEach(n => select.innerHTML += `<option value="${n.id}">${n.nombre}</option>`);
            }

            // 4. Cargar Asistentes (Todos los usuarios)
            const { data: asistentes } = await _supabase.from('usuarios').select('id, nombre').order('nombre');
            todosLosAsistentes = asistentes || [];
            renderizarAsistentes(todosLosAsistentes);
        }

        // Función para dibujar los checkboxes de asistentes
        function renderizarAsistentes(lista) {
            const contenedor = document.getElementById('listaAsistentes');
            
            if (lista.length === 0) {
                contenedor.innerHTML = '<p class="text-sm text-slate-500 col-span-full text-center py-4 font-medium">No se encontraron personas.</p>';
                return;
            }

            contenedor.innerHTML = '';
            lista.forEach(a => {
                contenedor.innerHTML += `
                <label class="flex items-center gap-3 cursor-pointer p-3 hover:bg-white bg-white/60 rounded-xl border border-slate-200 hover:border-blue-300 transition-all shadow-sm group">
                    <input type="checkbox" value="${a.id}" class="asistente-check w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer">
                    <span class="text-sm text-slate-700 font-bold group-hover:text-blue-700 transition-colors">${a.nombre}</span>
                </label>`;
            });
        }

        // Lógica del buscador
        document.getElementById('buscadorPersonal').addEventListener('input', (e) => {
            const termino = e.target.value.toLowerCase();
            const filtrados = todosLosAsistentes.filter(a => a.nombre.toLowerCase().includes(termino));
            renderizarAsistentes(filtrados);
        });

        document.getElementById('formAsignacion').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
            btn.disabled = true;

            const negocioId = document.getElementById('negocioAsig').value;
            const encargadoId = document.getElementById('encargadoAsig').value;
            
            // 1. Guardar la Asignación Principal
            const nuevaAsignacion = {
                fecha: document.getElementById('fechaAsig').value,
                encargado_id: encargadoId,
                bodega_id: document.getElementById('bodegaAsig').value,
                negocio_id: negocioId
            };

            const { data: asigGuardada, error: errorAsig } = await _supabase
                .from('asignaciones')
                .insert([nuevaAsignacion])
                .select()
                .single();

            if (errorAsig) {
                mostrarMensaje('Error: ' + errorAsig.message, 'rose');
                btn.innerHTML = '<i class="fa-solid fa-save"></i> Guardar Asignación';
                btn.disabled = false;
                return;
            }

            // 2. Obtener las metas por defecto del negocio
            const { data: metas } = await _supabase
                .from('metas_reglas')
                .select('rol, meta_sku')
                .eq('negocio_id', negocioId);
            
            const metaEncargado = metas.find(m => m.rol === 'encargado')?.meta_sku || 0;
            const metaAsistente = metas.find(m => m.rol === 'asistente')?.meta_sku || 0;

            // 3. Guardar al ENCARGADO seleccionado
            await _supabase.from('asignacion_personal').insert([{
                asignacion_id: asigGuardada.id,
                operador_id: encargadoId,
                rol_en_equipo: 'encargado',
                meta_del_dia: metaEncargado
            }]);

            // 4. Guardar a los ASISTENTES seleccionados
            const asistentesSeleccionados = Array.from(document.querySelectorAll('.asistente-check:checked')).map(cb => cb.value);
            
            if (asistentesSeleccionados.length > 0) {
                const personalRows = asistentesSeleccionados
                    .filter(id => id !== encargadoId) // Evitar que el encargado se duplique
                    .map(opId => ({
                        asignacion_id: asigGuardada.id,
                        operador_id: opId,
                        rol_en_equipo: 'asistente',
                        meta_del_dia: metaAsistente
                    }));
                
                if(personalRows.length > 0) {
                    await _supabase.from('asignacion_personal').insert(personalRows);
                }
            }

            mostrarMensaje('¡Asignación y equipo guardados con éxito! Redirigiendo...', 'emerald');
            setTimeout(() => { window.location.href = 'productividad.html'; }, 1500);
        });

        function mostrarMensaje(texto, color) {
            const msg = document.getElementById('mensaje');
            msg.innerText = texto;
            msg.className = `mt-4 text-center font-bold block p-4 rounded-xl text-${color}-700 bg-${color}-100 border border-${color}-200`;
        }

        cargarDatos();
    </script>
</body>
</html>
