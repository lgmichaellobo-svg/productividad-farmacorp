<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progreso de Verificación - Farmacorp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; } </style>
</head>
<body class="bg-slate-50 h-screen flex overflow-hidden">

    <aside class="w-64 bg-slate-900 text-slate-300 flex-col hidden lg:flex shadow-2xl z-20">
        <div class="p-6 flex items-center gap-3 border-b border-slate-800">
            <div class="w-10 h-10 bg-gradient-to-tr from-orange-500 to-orange-400 rounded-xl flex items-center justify-center text-white shadow-lg shadow-orange-500/30">
                <i class="fa-solid fa-boxes-stacked text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white tracking-tight">Farmacorp</h1>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Inventario</p>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-2 mt-4">
            <a href="app.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition font-medium">
                <i class="fa-solid fa-house w-5 text-center"></i> Inicio
            </a>
            <a href="verificacion.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition font-medium">
                <i class="fa-solid fa-upload w-5 text-center"></i> Cargar Inventario
            </a>
            <a href="progreso_verificacion.html" class="flex items-center gap-3 px-4 py-3 bg-orange-600 text-white rounded-xl shadow-lg shadow-orange-900/50 transition font-medium">
                <i class="fa-solid fa-chart-simple w-5 text-center"></i> Progreso del Equipo
            </a>
            <a href="mis_items.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition font-medium text-orange-400">
                <i class="fa-solid fa-clipboard-check w-5 text-center"></i> Mis Ítems
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto relative">
        <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-orange-50/50 to-slate-50 -z-10"></div>

        <header class="bg-white/80 backdrop-blur-md shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-10 border-b border-slate-200">
            <h2 class="text-xl font-bold text-slate-800 tracking-tight">Progreso del Equipo</h2>
            <button id="btnDescargarErrores" class="text-sm bg-rose-600 hover:bg-rose-700 text-white font-bold px-4 py-2 rounded-lg transition shadow-md flex items-center gap-2">
                <i class="fa-solid fa-file-excel"></i> Descargar Errores
            </button>
        </header>

        <div class="p-4 md:p-8 flex-1 max-w-5xl mx-auto w-full">
            
            <div id="mensajeEstado" class="text-center py-10 text-slate-500 font-bold text-lg hidden">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-4 text-orange-500"></i>
                <p>Cargando datos de la verificación...</p>
            </div>

            <div id="panelProgreso" class="hidden">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Resumen de la Verificación</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-slate-50 p-4 rounded-xl text-center border border-slate-200">
                            <p class="text-xs text-slate-500 font-bold mb-1">Total Ítems</p>
                            <p class="text-2xl font-black text-slate-800" id="resTotal">0</p>
                        </div>
                        <div class="bg-emerald-50 p-4 rounded-xl text-center border border-emerald-100">
                            <p class="text-xs text-emerald-600 font-bold mb-1">Correctos</p>
                            <p class="text-2xl font-black text-emerald-800" id="resCorrectos">0</p>
                        </div>
                        <div class="bg-rose-50 p-4 rounded-xl text-center border border-rose-100">
                            <p class="text-xs text-rose-600 font-bold mb-1">Con Error</p>
                            <p class="text-2xl font-black text-rose-800" id="resErrores">0</p>
                        </div>
                        <div class="bg-orange-50 p-4 rounded-xl text-center border border-orange-100">
                            <p class="text-xs text-orange-600 font-bold mb-1">Pendientes</p>
                            <p class="text-2xl font-black text-orange-800" id="resPendientes">0</p>
                        </div>
                    </div>
                </div>

                <h3 class="text-lg font-bold text-slate-800 mb-4">Avance por Persona</h3>
                <div id="listaProgreso" class="space-y-4">
                    <!-- Tarjetas de progreso por persona -->
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://wwurfjenenlvrhwakmso.supabase.co';
        const supabaseKey = 'sb_publishable_cn1zFLzla27K4l4EPltEbw_8YAgoq0C'; 
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let itemsErroresGlobal = [];

        async function cargarProgreso() {
            // 1. Obtener la verificación activa
            const { data: verificacion, error: errVerif } = await _supabase
                .from('verificaciones')
                .select('id')
                .eq('estado', 'en curso')
                .single();

            if (errVerif || !verificacion) {
                document.getElementById('mensajeEstado').innerHTML = '<i class="fa-solid fa-folder-open text-3xl mb-4 text-slate-400"></i><p>No hay ninguna verificación en curso.</p>';
                return;
            }

            // 2. Obtener todos los ítems de esa verificación con los nombres de los usuarios
            const { data: items, error: errItems } = await _supabase
                .from('verificacion_items')
                .select(`
                    *,
                    usuarios (nombre)
                `)
                .eq('verificacion_id', verificacion.id);

            if (errItems) {
                console.error(errItems);
                return;
            }

            // 3. Procesar métricas
            let total = items.length;
            let correctos = 0;
            let errores = 0;
            let pendientes = 0;
            let usuariosStats = {};

            itemsErroresGlobal = []; // Reiniciar

            items.forEach(item => {
                let nombre = item.usuarios ? item.usuarios.nombre : 'Sin Asignar';
                
                if (!usuariosStats[nombre]) {
                    usuariosStats[nombre] = { total: 0, correctos: 0, errores: 0, pendientes: 0 };
                }
                usuariosStats[nombre].total++;

                if (item.estado === 'correcto') {
                    correctos++;
                    usuariosStats[nombre].correctos++;
                } else if (item.estado === 'incorrecto') {
                    errores++;
                    usuariosStats[nombre].errores++;
                    itemsErroresGlobal.push(item); // Guardar para el Excel
                } else {
                    pendientes++;
                    usuariosStats[nombre].pendientes++;
                }
            });

            // 4. Actualizar vista general
            document.getElementById('resTotal').innerText = total;
            document.getElementById('resCorrectos').innerText = correctos;
            document.getElementById('resErrores').innerText = errores;
            document.getElementById('resPendientes').innerText = pendientes;

            // 5. Generar tarjetas por usuario
            const contenedor = document.getElementById('listaProgreso');
            contenedor.innerHTML = '';

            for (const [nombre, stats] of Object.entries(usuariosStats)) {
                const porcentaje = Math.round((stats.correctos + stats.errores) / stats.total * 100) || 0;
                
                contenedor.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                        <div class="flex justify-between items-center mb-2">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center font-bold">
                                    ${nombre.charAt(0)}
                                </div>
                                <div>
                                    <h4 class="font-bold text-slate-800">${nombre}</h4>
                                    <p class="text-xs text-slate-500">${stats.correctos + stats.errores} de ${stats.total} revisados</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="text-lg font-black ${porcentaje === 100 ? 'text-emerald-500' : 'text-orange-500'}">${porcentaje}%</span>
                            </div>
                        </div>
                        
                        <!-- Barra de progreso -->
                        <div class="w-full bg-slate-100 rounded-full h-2.5 mb-2 flex overflow-hidden">
                            <div class="bg-emerald-500 h-2.5" style="width: ${(stats.correctos/stats.total)*100}%"></div>
                            <div class="bg-rose-500 h-2.5" style="width: ${(stats.errores/stats.total)*100}%"></div>
                        </div>
                        
                        <div class="flex gap-4 text-xs font-semibold mt-3">
                            <span class="text-emerald-600"><i class="fa-solid fa-check-circle mr-1"></i> ${stats.correctos} OK</span>
                            <span class="text-rose-600"><i class="fa-solid fa-times-circle mr-1"></i> ${stats.errores} Errores</span>
                            <span class="text-slate-400"><i class="fa-solid fa-clock mr-1"></i> ${stats.pendientes} Faltan</span>
                        </div>
                    </div>
                `;
            }

            document.getElementById('mensajeEstado').classList.add('hidden');
            document.getElementById('panelProgreso').classList.remove('hidden');
        }

        // --- DESCARGAR EXCEL DE ERRORES ---
        document.getElementById('btnDescargarErrores').addEventListener('click', async () => {
            if (itemsErroresGlobal.length === 0) {
                return alert('No hay errores registrados todavía para descargar.');
            }

            const btn = document.getElementById('btnDescargarErrores');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generando...';
            btn.disabled = true;

            try {
                const workbook = new ExcelJS.Workbook();
                const worksheet = workbook.addWorksheet('Errores Detectados');

                worksheet.columns = [
                    { header: 'N° Lista', key: 'n', width: 10 },
                    { header: 'Código', key: 'codigo', width: 18 },
                    { header: 'Descripción', key: 'desc', width: 40 },
                    { header: 'Laboratorio', key: 'lab', width: 25 },
                    { header: 'Asignado a', key: 'asignado', width: 25 },
                    { header: 'Conteo Físico', key: 'conteo', width: 15 },
                    { header: 'Cant. Correcta', key: 'correcta', width: 15 },
                    { header: 'Diferencia', key: 'dif', width: 15 },
                    { header: 'Dif. Importe', key: 'importe', width: 15 }
                ];

                // Formato cabecera
                const headerRow = worksheet.getRow(1);
                headerRow.font = { bold: true, color: { argb: 'FFFFFFFF' } };
                headerRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE11D48' } }; // Rojo oscuro
                headerRow.alignment = { vertical: 'middle', horizontal: 'center' };
                headerRow.height = 25;

                itemsErroresGlobal.forEach(item => {
                    const row = worksheet.addRow({
                        n: item.numero_lista,
                        codigo: item.codigo,
                        desc: item.descripcion,
                        lab: item.laboratorio,
                        asignado: item.usuarios ? item.usuarios.nombre : 'Sin Asignar',
                        conteo: item.conteo_fisico,
                        correcta: item.cantidad_correcta,
                        dif: item.diferencia,
                        importe: item.dif_importe
                    });

                    // Alinear números al centro
                    row.getCell('conteo').alignment = { horizontal: 'center' };
                    row.getCell('correcta').alignment = { horizontal: 'center' };
                    row.getCell('dif').alignment = { horizontal: 'center' };
                    row.getCell('importe').alignment = { horizontal: 'center' };
                });

                // Bordes
                worksheet.eachRow((row) => row.eachCell((cell) => cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } }));

                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Errores_Inventario_${new Date().toISOString().split('T')[0]}.xlsx`;
                a.click();
                window.URL.revokeObjectURL(url);

            } catch (error) {
                console.error(error);
                alert('Error al generar el Excel.');
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-file-excel"></i> Descargar Errores';
                btn.disabled = false;
            }
        });

        // Iniciar
        cargarProgreso();
    </script>
</body>
</html>
