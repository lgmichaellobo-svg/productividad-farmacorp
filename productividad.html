<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productividad - Farma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; } 
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        
        /* Animación para las tarjetas de los trabajadores */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 font-sans h-screen flex overflow-hidden">

    <!-- Menú Lateral -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex-col hidden md:flex shadow-2xl z-20 relative flex-shrink-0 border-r border-slate-800">
        <div class="p-6 flex items-center gap-3 border-b border-slate-800">
            <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-blue-400 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/40">
                <i class="fa-solid fa-pills text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-extrabold text-white tracking-tight">Farma</h1>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-1.5 mt-2 overflow-y-auto">
            <a href="app.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition font-semibold text-sm"><i class="fa-solid fa-house w-5 text-center"></i> Inicio</a>
            <a href="productividad.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600/10 text-blue-400 border border-blue-500/20 rounded-xl transition font-bold text-sm"><i class="fa-solid fa-chart-line w-5 text-center"></i> Productividad</a>
        </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto relative">
        <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-blue-50/70 to-slate-50 -z-10"></div>

        <header class="glass-effect sticky top-0 z-10 px-4 md:px-6 py-4 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-200/60 shadow-sm gap-4">
            <h2 class="text-xl font-extrabold text-slate-800 tracking-tight">Registro de Productividad</h2>
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <a href="asignacion.html" class="flex-1 md:flex-none bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-2.5 px-5 rounded-xl transition shadow-lg shadow-blue-500/30 text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nueva Asignación
                </a>
                <a href="reportes.html" class="flex-1 md:flex-none bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200 font-bold py-2.5 px-5 rounded-xl transition shadow-sm text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-chart-pie"></i> Ver Reportes
                </a>
                <a href="app.html" class="flex-none text-slate-500 hover:text-slate-800 py-2.5 px-3 rounded-xl hover:bg-slate-100 transition font-bold text-sm flex items-center justify-center gap-1 bg-white border border-slate-200">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
            </div>
        </header>

        <div class="p-4 md:p-8 flex-1 max-w-4xl mx-auto w-full">
            
            <!-- Panel de Búsqueda -->
            <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 mb-8">
                <h3 class="text-lg font-extrabold text-slate-800 mb-6 border-b border-slate-100 pb-4 flex items-center gap-2">
                    <i class="fa-solid fa-calendar-day text-blue-500"></i> Datos de la Jornada
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Fecha de trabajo</label>
                        <input type="date" id="fecha" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none font-bold text-slate-800 transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Encargado</label>
                        <select id="encargado" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none font-bold text-slate-800 transition">
                            <option value="">Seleccione un encargado...</option>
                        </select>
                    </div>
                </div>

                <div id="panelAuto" class="hidden mt-6 bg-blue-50/50 border border-blue-100 p-5 rounded-2xl">
                    <p class="text-sm text-blue-800 font-extrabold mb-4 flex items-center gap-2"><i class="fa-solid fa-wand-magic-sparkles"></i> Datos de la asignación:</p>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 text-sm">
                        <div><span class="text-slate-500 block text-[10px] font-extrabold uppercase tracking-wider mb-1">Bodega</span> <span id="infoBodega" class="font-bold text-slate-800">-</span></div>
                        <div><span class="text-slate-500 block text-[10px] font-extrabold uppercase tracking-wider mb-1">Negocio</span> <span id="infoNegocio" class="font-bold text-slate-800">-</span></div>
                    </div>
                </div>
            </div>

            <!-- Panel de Registro -->
            <div id="panelRegistro" class="hidden bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-extrabold text-slate-800 mb-6 border-b border-slate-100 pb-4 flex items-center gap-2">
                    <i class="fa-solid fa-keyboard text-blue-500"></i> Ingresar Productividad
                </h3>
                
                <div class="flex gap-2 mb-8 bg-slate-100 p-1.5 rounded-xl w-full md:w-max">
                    <button type="button" id="btnModoManual" class="flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold text-sm bg-white shadow-sm text-blue-600 transition">Registro Manual</button>
                    <button type="button" id="btnModoExcel" class="flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold text-sm text-slate-500 hover:text-slate-700 transition">Importar Excel</button>
                </div>

                <form id="formProductividad">
                    <div id="listaPersonas" class="space-y-4 mb-8"></div>
                    <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-extrabold py-4 rounded-2xl transition-all shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2 text-lg">
                        <i class="fa-solid fa-save"></i> Guardar Productividad
                    </button>
                </form>

                <div id="formExcel" class="hidden border-2 border-dashed border-slate-300 rounded-2xl p-10 text-center bg-slate-50">
                    <div class="w-16 h-16 bg-white border border-slate-100 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm">
                        <i class="fa-solid fa-file-excel text-2xl text-emerald-500"></i>
                    </div>
                    <h4 class="text-lg font-extrabold text-slate-800 mb-2">Sube tu archivo de Productividad</h4>
                    <p class="text-sm text-slate-500 mb-6 font-medium">El archivo debe tener las columnas "Nombre" y "SKU".</p>
                    <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden">
                    <label for="excelFile" class="bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-8 rounded-xl cursor-pointer transition shadow-md inline-block">
                        <i class="fa-solid fa-upload mr-2"></i> Seleccionar Archivo
                    </label>
                    <p id="excelFileName" class="mt-4 text-sm font-bold text-emerald-600"></p>
                </div>

                <div id="mensajeProd" class="mt-4 text-center font-bold hidden p-4 rounded-xl"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://wwurfjenenlvrhwakmso.supabase.co';
        const supabaseKey = 'sb_publishable_cn1zFLzla27K4l4EPltEbw_8YAgoq0C'; 
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let asignacionActualId = null;
        let equipoActual = []; 

        window.editarMeta = function(id) {
            document.getElementById(`view-meta-${id}`).classList.add('hidden');
            const editContainer = document.getElementById(`edit-meta-${id}`);
            editContainer.classList.remove('hidden');
            editContainer.classList.add('flex');
            document.getElementById(`input-meta-${id}`).focus();
        }

        window.guardarMeta = function(id) {
            document.getElementById(`edit-meta-${id}`).classList.add('hidden');
            const viewContainer = document.getElementById(`view-meta-${id}`);
            viewContainer.classList.remove('hidden');
            viewContainer.classList.add('flex');
            const newVal = document.getElementById(`input-meta-${id}`).value;
            document.getElementById(`val-meta-${id}`).innerText = newVal;
        }

        async function cargarEncargados() {
            const { data, error } = await _supabase.from('usuarios').select('id, nombre, rol').order('nombre');
                
            if (error) return;

            if (data && data.length > 0) {
                const select = document.getElementById('encargado');
                select.innerHTML = '<option value="">Seleccione un encargado...</option>';
                
                const permitidos = data.filter(u => ['encargado', 'mixto', 'admin', 'jefe', 'supervisor'].includes(u.rol));
                
                permitidos.forEach(user => {
                    select.innerHTML += `<option value="${user.id}">${user.nombre}</option>`;
                });
            }
        }

        document.getElementById('btnModoManual').addEventListener('click', () => {
            document.getElementById('formProductividad').classList.remove('hidden');
            document.getElementById('formExcel').classList.add('hidden');
            document.getElementById('btnModoManual').className = 'flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold text-sm bg-white shadow-sm text-blue-600 transition';
            document.getElementById('btnModoExcel').className = 'flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold text-sm text-slate-500 hover:text-slate-700 transition';
        });

        document.getElementById('btnModoExcel').addEventListener('click', () => {
            document.getElementById('formProductividad').classList.add('hidden');
            document.getElementById('formExcel').classList.remove('hidden');
            document.getElementById('btnModoExcel').className = 'flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold text-sm bg-white shadow-sm text-emerald-600 transition';
            document.getElementById('btnModoManual').className = 'flex-1 md:flex-none px-6 py-2.5 rounded-lg font-bold text-sm text-slate-500 hover:text-slate-700 transition';
        });

        document.getElementById('encargado').addEventListener('change', async (e) => {
            const encargadoId = e.target.value;
            const fecha = document.getElementById('fecha').value;
            const panelAuto = document.getElementById('panelAuto');
            const panelRegistro = document.getElementById('panelRegistro');

            if (!encargadoId || !fecha) { 
                panelAuto.classList.add('hidden'); 
                panelRegistro.classList.add('hidden');
                return; 
            }

            const { data: asignacion } = await _supabase
                .from('asignaciones')
                .select(`id, bodegas (nombre), tipos_negocio (id, nombre)`)
                .eq('encargado_id', encargadoId)
                .eq('fecha', fecha)
                .single();

            if (asignacion) {
                asignacionActualId = asignacion.id;
                panelAuto.classList.remove('hidden');
                document.getElementById('infoBodega').innerText = asignacion.bodegas.nombre;
                document.getElementById('infoNegocio').innerText = asignacion.tipos_negocio.nombre;
                
                const { data: personal } = await _supabase
                    .from('asignacion_personal')
                    .select(`id, operador_id, rol_en_equipo, meta_del_dia, usuarios (nombre)`)
                    .eq('asignacion_id', asignacion.id);

                const { data: metas } = await _supabase
                    .from('metas_reglas')
                    .select('rol, meta_sku')
                    .eq('negocio_id', asignacion.tipos_negocio.id);

                const metaEncargadoDef = metas.find(m => m.rol === 'encargado')?.meta_sku || 0;
                const metaAsistenteDef = metas.find(m => m.rol === 'asistente')?.meta_sku || 0;

                equipoActual = [{ id: encargadoId, nombre: e.target.options[e.target.selectedIndex].text, rol: 'encargado' }];

                let htmlPersonas = `
                    <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 animate-card">
                        <div class="w-full md:w-1/2">
                            <p class="font-extrabold text-slate-800 text-lg flex items-center gap-2">
                                ${e.target.options[e.target.selectedIndex].text} 
                                <span class="text-[10px] font-extrabold text-blue-600 bg-blue-100 px-2 py-1 rounded-md uppercase tracking-wider">Encargado</span>
                            </p>
                            
                            <div class="mt-2 flex items-center gap-2 text-sm text-slate-600">
                                <span id="view-meta-${encargadoId}" class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
                                    Meta: <span id="val-meta-${encargadoId}" class="font-black text-blue-700">${metaEncargadoDef}</span> SKU
                                    <button type="button" onclick="editarMeta('${encargadoId}')" class="text-slate-400 hover:text-blue-600 transition ml-1">
                                        <i class="fa-solid fa-pencil text-xs"></i>
                                    </button>
                                </span>
                                <span id="edit-meta-${encargadoId}" class="hidden items-center gap-2 bg-white px-2 py-1 rounded-lg border border-blue-300">
                                    <input type="number" name="meta_${encargadoId}" id="input-meta-${encargadoId}" value="${metaEncargadoDef}" class="w-16 px-1 py-1 text-center font-black text-blue-700 outline-none bg-transparent">
                                    <button type="button" onclick="guardarMeta('${encargadoId}')" class="text-emerald-600 hover:text-emerald-800 transition">
                                        <i class="fa-solid fa-check text-sm"></i>
                                    </button>
                                </span>
                            </div>
                        </div>
                        <div class="w-full md:w-36">
                            <label class="block text-[10px] font-extrabold text-blue-600 mb-1.5 uppercase tracking-wider">SKU Logrados</label>
                            <input type="number" name="prod_${encargadoId}" placeholder="0" class="w-full px-3 py-3 border border-slate-300 rounded-xl text-center font-black text-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition" required>
                        </div>
                    </div>
                `;

                if (personal && personal.length > 0) {
                    personal.forEach(p => {
                        if (p.rol_en_equipo === 'asistente') {
                            equipoActual.push({ id: p.operador_id, nombre: p.usuarios.nombre, rol: 'asistente' });
                            const metaActual = p.meta_del_dia || metaAsistenteDef;
                            
                            htmlPersonas += `
                                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4 animate-card">
                                    <div class="w-full md:w-1/2">
                                        <p class="font-bold text-slate-800 text-lg flex items-center gap-2">
                                            ${p.usuarios.nombre}
                                            <span class="text-[10px] font-extrabold text-slate-500 bg-slate-100 px-2 py-1 rounded-md uppercase tracking-wider">Asistente</span>
                                        </p>
                                        
                                        <div class="mt-2 flex items-center gap-2 text-sm text-slate-600">
                                            <span id="view-meta-${p.operador_id}" class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm">
                                                Meta: <span id="val-meta-${p.operador_id}" class="font-black text-blue-700">${metaActual}</span> SKU
                                                <button type="button" onclick="editarMeta('${p.operador_id}')" class="text-slate-400 hover:text-blue-600 transition ml-1">
                                                    <i class="fa-solid fa-pencil text-xs"></i>
                                                </button>
                                            </span>
                                            <span id="edit-meta-${p.operador_id}" class="hidden items-center gap-2 bg-white px-2 py-1 rounded-lg border border-blue-300">
                                                <input type="number" name="meta_${p.operador_id}" id="input-meta-${p.operador_id}" value="${metaActual}" class="w-16 px-1 py-1 text-center font-black text-blue-700 outline-none bg-transparent">
                                                <button type="button" onclick="guardarMeta('${p.operador_id}')" class="text-emerald-600 hover:text-emerald-800 transition">
                                                    <i class="fa-solid fa-check text-sm"></i>
                                                </button>
                                            </span>
                                        </div>
                                    </div>
                                    <div class="w-full md:w-36">
                                        <label class="block text-[10px] font-extrabold text-blue-600 mb-1.5 uppercase tracking-wider">SKU Logrados</label>
                                        <input type="number" name="prod_${p.operador_id}" placeholder="0" class="w-full px-3 py-3 border border-slate-300 rounded-xl text-center font-black text-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition" required>
                                    </div>
                                </div>
                            `;
                        }
                    });
                }

                document.getElementById('listaPersonas').innerHTML = htmlPersonas;
                panelRegistro.classList.remove('hidden');

            } else {
                panelAuto.classList.add('hidden');
                panelRegistro.classList.add('hidden');
                alert("No hay asignación para esta fecha. Por favor, crea una nueva.");
            }
        });

        document.getElementById('formProductividad').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
            btn.disabled = true;

            const inputsProd = document.querySelectorAll('#listaPersonas input[name^="prod_"]');
            const registros = [];
            const actualizacionesMeta = [];
            const operadoresIds = [];

            inputsProd.forEach(input => {
                const operadorId = input.name.replace('prod_', '');
                operadoresIds.push(operadorId);
                const sku = parseInt(input.value) || 0;
                const metaInput = document.querySelector(`input[name="meta_${operadorId}"]`);
                const metaNueva = parseInt(metaInput.value) || 0;

                registros.push({
                    asignacion_id: asignacionActualId,
                    operador_id: operadorId,
                    sku_revisados: sku,
                    origen: 'manual'
                });

                actualizacionesMeta.push({
                    operador_id: operadorId,
                    meta_del_dia: metaNueva
                });
            });

            await _supabase.from('productividad')
                .delete()
                .eq('asignacion_id', asignacionActualId)
                .in('operador_id', operadoresIds);

            const { error: errorProd } = await _supabase.from('productividad').insert(registros);
            
            if (errorProd) {
                mostrarMensaje('Error al guardar: ' + errorProd.message, 'rose');
                btn.innerHTML = '<i class="fa-solid fa-save"></i> Guardar Productividad';
                btn.disabled = false;
                return;
            }

            for (let act of actualizacionesMeta) {
                await _supabase.from('asignacion_personal')
                    .update({ meta_del_dia: act.meta_del_dia, meta_es_especial: true })
                    .eq('asignacion_id', asignacionActualId)
                    .eq('operador_id', act.operador_id);
            }

            mostrarMensaje('¡Productividad y metas guardadas con éxito!', 'emerald');
            btn.innerHTML = '<i class="fa-solid fa-save"></i> Guardar Productividad';
            btn.disabled = false;
        });

        document.getElementById('excelFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('excelFileName').innerText = "Leyendo archivo...";
            const reader = new FileReader();

            reader.onload = async function(event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(firstSheet);

                    let resultadosExcel = {};
                    json.forEach(row => {
                        let nombreKey = Object.keys(row).find(k => k.toUpperCase().includes('NOMBRE') || k.toUpperCase().includes('TRABAJADOR'));
                        let skuKey = Object.keys(row).find(k => k.toUpperCase().includes('SKU') || k.toUpperCase().includes('CANTIDAD'));

                        if (nombreKey && skuKey) {
                            let nombre = String(row[nombreKey]).trim().toUpperCase();
                            let sku = Number(row[skuKey]) || 0;
                            resultadosExcel[nombre] = (resultadosExcel[nombre] || 0) + sku;
                        }
                    });

                    const registros = [];
                    equipoActual.forEach(persona => {
                        const nombreDb = persona.nombre.toUpperCase();
                        const matchKey = Object.keys(resultadosExcel).find(k => k.includes(nombreDb) || nombreDb.includes(k));
                        
                        if (matchKey) {
                            registros.push({
                                asignacion_id: asignacionActualId,
                                operador_id: persona.id,
                                sku_revisados: resultadosExcel[matchKey],
                                origen: 'excel'
                            });
                        }
                    });

                    if (registros.length === 0) {
                        mostrarMensaje('No se encontraron nombres coincidentes.', 'rose');
                        document.getElementById('excelFileName').innerText = "";
                        return;
                    }

                    const ids = registros.map(r => r.operador_id);
                    await _supabase.from('productividad')
                        .delete()
                        .eq('asignacion_id', asignacionActualId)
                        .in('operador_id', ids);

                    const { error } = await _supabase.from('productividad').insert(registros);
                    if (error) {
                        mostrarMensaje('Error: ' + error.message, 'rose');
                    } else {
                        mostrarMensaje('¡Productividad importada con éxito!', 'emerald');
                        document.getElementById('excelFileName').innerText = `Procesado: ${file.name}`;
                    }

                } catch (error) {
                    mostrarMensaje('Error al leer el Excel.', 'rose');
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function mostrarMensaje(texto, color) {
            const msg = document.getElementById('mensajeProd');
            msg.innerText = texto;
            msg.className = `mt-4 text-center font-bold block p-4 rounded-xl text-${color}-700 bg-${color}-100 border border-${color}-200`;
            setTimeout(() => { msg.classList.add('hidden'); }, 5000);
        }

        cargarEncargados();
    </script>
</body>
</html>
