<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productividad - Farmacorp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 font-sans h-screen flex overflow-hidden">

    <aside class="w-64 bg-slate-900 text-slate-300 flex-col hidden md:flex shadow-2xl z-10">
        <div class="p-6 flex items-center gap-3 border-b border-slate-800">
            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-lg"><i class="fa-solid fa-pills text-xl"></i></div>
            <div><h1 class="text-lg font-bold text-white tracking-wide">Farmacorp</h1></div>
        </div>
        <nav class="flex-1 p-4 space-y-1 mt-4">
            <a href="app.html" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition"><i class="fa-solid fa-house w-5"></i> Inicio</a>
            <a href="productividad.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl shadow-md transition"><i class="fa-solid fa-chart-line w-5"></i> Productividad</a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <header class="bg-white shadow-sm px-4 md:px-6 py-4 flex flex-col md:flex-row justify-between items-start md:items-center sticky top-0 z-10 gap-4">
            <h2 class="text-xl font-bold text-slate-800">Registro de Productividad</h2>
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                <a href="asignacion.html" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-5 rounded-xl transition shadow-sm text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nueva Asignación
                </a>
                <a href="reportes.html" class="flex-1 md:flex-none bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200 font-semibold py-2.5 px-5 rounded-xl transition shadow-sm text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-chart-pie"></i> Ver Reportes
                </a>
                <a href="app.html" class="flex-none text-slate-500 hover:text-slate-800 py-2.5 px-4 rounded-xl hover:bg-slate-100 transition font-semibold text-sm flex items-center justify-center gap-2 border border-slate-200">
                    <i class="fa-solid fa-arrow-left"></i> <span class="hidden lg:inline">Volver</span>
                </a>
            </div>
        </header>

        <div class="p-4 md:p-10 flex-1 max-w-4xl mx-auto w-full">
            
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 mb-8">
                <h3 class="text-lg font-bold text-slate-800 mb-6 border-b pb-4">Datos de la Jornada</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Fecha de trabajo</label>
                        <input type="date" id="fecha" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Encargado</label>
                        <select id="encargado" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                            <option value="">Seleccione un encargado...</option>
                        </select>
                    </div>
                </div>

                <div id="panelAuto" class="hidden mt-6 bg-blue-50 border border-blue-100 p-6 rounded-xl">
                    <p class="text-sm text-blue-800 font-semibold mb-4"><i class="fa-solid fa-wand-magic-sparkles"></i> Datos autocompletados:</p>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 text-sm">
                        <div><span class="text-slate-500 block">Bodega</span> <span id="infoBodega" class="font-bold text-slate-800">-</span></div>
                        <div><span class="text-slate-500 block">Negocio</span> <span id="infoNegocio" class="font-bold text-slate-800">-</span></div>
                    </div>
                </div>
            </div>

            <div id="panelRegistro" class="hidden bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-slate-800 mb-6 border-b pb-4">Ingresar Productividad</h3>
                
                <div class="flex gap-2 mb-6 bg-slate-100 p-1 rounded-xl w-full md:w-max">
                    <button type="button" id="btnModoManual" class="flex-1 md:flex-none px-4 py-2 rounded-lg font-bold text-sm bg-white shadow-sm text-blue-600 transition">Registro Manual</button>
                    <button type="button" id="btnModoExcel" class="flex-1 md:flex-none px-4 py-2 rounded-lg font-bold text-sm text-slate-500 hover:text-slate-700 transition">Importar Excel</button>
                </div>

                <form id="formProductividad">
                    <div id="listaPersonas" class="space-y-4 mb-6"></div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg mt-4">
                        <i class="fa-solid fa-save"></i> Guardar Productividad
                    </button>
                </form>

                <div id="formExcel" class="hidden border-2 border-dashed border-slate-300 rounded-2xl p-10 text-center bg-slate-50">
                    <i class="fa-solid fa-file-excel text-5xl text-green-500 mb-4"></i>
                    <h4 class="text-lg font-bold text-slate-800 mb-2">Sube tu archivo de Productividad</h4>
                    <p class="text-sm text-slate-500 mb-6">El archivo debe tener las columnas "Nombre" y "SKU".</p>
                    <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden">
                    <label for="excelFile" class="bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-6 rounded-xl cursor-pointer transition shadow-md inline-block">
                        <i class="fa-solid fa-upload"></i> Seleccionar Archivo
                    </label>
                    <p id="excelFileName" class="mt-4 text-sm font-medium text-blue-600"></p>
                </div>

                <div id="mensajeProd" class="mt-4 text-center font-bold hidden"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://wwurfjenenlvrhwakmso.supabase.co';
        const supabaseKey = 'sb_publishable_cn1zFLzla27K4l4EPltEbw_8YAgoq0C'; 
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let asignacionActualId = null;
        let equipoActual = []; 

        window.editarMeta = function(id) {
            document.getElementById(`view-meta-${id}`).classList.add('hidden');
            const editContainer = document.getElementById(`edit-meta-${id}`);
            editContainer.classList.remove('hidden');
            editContainer.classList.add('flex');
            document.getElementById(`input-meta-${id}`).focus();
        }

        window.guardarMeta = function(id) {
            document.getElementById(`edit-meta-${id}`).classList.add('hidden');
            const viewContainer = document.getElementById(`view-meta-${id}`);
            viewContainer.classList.remove('hidden');
            viewContainer.classList.add('flex');
            const newVal = document.getElementById(`input-meta-${id}`).value;
            document.getElementById(`val-meta-${id}`).innerText = newVal;
        }

        async function cargarEncargados() {
            const { data } = await _supabase.from('usuarios').select('id, nombre').eq('rol', 'encargado');
            if (data) {
                const select = document.getElementById('encargado');
                data.forEach(user => select.innerHTML += `<option value="${user.id}">${user.nombre}</option>`);
            }
        }

        document.getElementById('btnModoManual').addEventListener('click', () => {
            document.getElementById('formProductividad').classList.remove('hidden');
            document.getElementById('formExcel').classList.add('hidden');
            document.getElementById('btnModoManual').className = 'flex-1 md:flex-none px-4 py-2 rounded-lg font-bold text-sm bg-white shadow-sm text-blue-600 transition';
            document.getElementById('btnModoExcel').className = 'flex-1 md:flex-none px-4 py-2 rounded-lg font-bold text-sm text-slate-500 hover:text-slate-700 transition';
        });

        document.getElementById('btnModoExcel').addEventListener('click', () => {
            document.getElementById('formProductividad').classList.add('hidden');
            document.getElementById('formExcel').classList.remove('hidden');
            document.getElementById('btnModoExcel').className = 'flex-1 md:flex-none px-4 py-2 rounded-lg font-bold text-sm bg-white shadow-sm text-green-600 transition';
            document.getElementById('btnModoManual').className = 'flex-1 md:flex-none px-4 py-2 rounded-lg font-bold text-sm text-slate-500 hover:text-slate-700 transition';
        });

        document.getElementById('encargado').addEventListener('change', async (e) => {
            const encargadoId = e.target.value;
            const fecha = document.getElementById('fecha').value;
            const panelAuto = document.getElementById('panelAuto');
            const panelRegistro = document.getElementById('panelRegistro');

            if (!encargadoId || !fecha) { 
                panelAuto.classList.add('hidden'); 
                panelRegistro.classList.add('hidden');
                return; 
            }

            const { data: asignacion } = await _supabase
                .from('asignaciones')
                .select(`id, bodegas (nombre), tipos_negocio (id, nombre)`)
                .eq('encargado_id', encargadoId)
                .eq('fecha', fecha)
                .single();

            if (asignacion) {
                asignacionActualId = asignacion.id;
                panelAuto.classList.remove('hidden');
                document.getElementById('infoBodega').innerText = asignacion.bodegas.nombre;
                document.getElementById('infoNegocio').innerText = asignacion.tipos_negocio.nombre;
                
                const { data: personal } = await _supabase
                    .from('asignacion_personal')
                    .select(`id, operador_id, rol_en_equipo, meta_del_dia, usuarios (nombre)`)
                    .eq('asignacion_id', asignacion.id);

                const { data: metas } = await _supabase
                    .from('metas_reglas')
                    .select('rol, meta_sku')
                    .eq('negocio_id', asignacion.tipos_negocio.id);

                const metaEncargadoDef = metas.find(m => m.rol === 'encargado')?.meta_sku || 0;
                const metaAsistenteDef = metas.find(m => m.rol === 'asistente')?.meta_sku || 0;

                equipoActual = [{ id: encargadoId, nombre: e.target.options[e.target.selectedIndex].text, rol: 'encargado' }];

                let htmlPersonas = `
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="w-full md:w-1/2">
                            <p class="font-bold text-slate-800 text-lg">${e.target.options[e.target.selectedIndex].text} <span class="text-xs font-normal text-slate-500">(Tú)</span></p>
                            
                            <div class="mt-1 flex items-center gap-2 text-sm text-slate-600">
                                <span id="view-meta-${encargadoId}" class="flex items-center gap-2">
                                    Meta: <span id="val-meta-${encargadoId}" class="font-bold text-blue-700">${metaEncargadoDef}</span> SKU
                                    <button type="button" onclick="editarMeta('${encargadoId}')" class="text-blue-500 hover:text-blue-700 p-1 rounded hover:bg-blue-50 transition">
                                        <i class="fa-solid fa-pencil text-xs"></i>
                                    </button>
                                </span>
                                <span id="edit-meta-${encargadoId}" class="hidden items-center gap-2">
                                    Meta: 
                                    <input type="number" name="meta_${encargadoId}" id="input-meta-${encargadoId}" value="${metaEncargadoDef}" class="w-20 px-2 py-1 border border-blue-400 rounded text-center focus:outline-none focus:ring-1 focus:ring-blue-500 font-bold text-blue-700 bg-white">
                                    <button type="button" onclick="guardarMeta('${encargadoId}')" class="text-green-600 hover:text-green-800 p-1 rounded hover:bg-green-50 transition">
                                        <i class="fa-solid fa-check text-xs"></i>
                                    </button>
                                </span>
                            </div>
                        </div>
                        <div class="w-full md:w-32">
                            <label class="block text-xs font-bold text-blue-600 mb-1">SKU Logrados</label>
                            <input type="number" name="prod_${encargadoId}" placeholder="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-center font-bold text-xl focus:ring-2 focus:ring-blue-500 outline-none transition" required>
                        </div>
                    </div>
                `;

                if (personal && personal.length > 0) {
                    personal.forEach(p => {
                        if (p.rol_en_equipo === 'asistente') {
                            equipoActual.push({ id: p.operador_id, nombre: p.usuarios.nombre, rol: 'asistente' });
                            const metaActual = p.meta_del_dia || metaAsistenteDef;
                            
                            htmlPersonas += `
                                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div class="w-full md:w-1/2">
                                        <p class="font-bold text-slate-800 text-lg">${p.usuarios.nombre}</p>
                                        
                                        <div class="mt-1 flex items-center gap-2 text-sm text-slate-600">
                                            <span id="view-meta-${p.operador_id}" class="flex items-center gap-2">
                                                Meta: <span id="val-meta-${p.operador_id}" class="font-bold text-blue-700">${metaActual}</span> SKU
                                                <button type="button" onclick="editarMeta('${p.operador_id}')" class="text-blue-500 hover:text-blue-700 p-1 rounded hover:bg-blue-50 transition">
                                                    <i class="fa-solid fa-pencil text-xs"></i>
                                                </button>
                                            </span>
                                            <span id="edit-meta-${p.operador_id}" class="hidden items-center gap-2">
                                                Meta: 
                                                <input type="number" name="meta_${p.operador_id}" id="input-meta-${p.operador_id}" value="${metaActual}" class="w-20 px-2 py-1 border border-blue-400 rounded text-center focus:outline-none focus:ring-1 focus:ring-blue-500 font-bold text-blue-700 bg-white">
                                                <button type="button" onclick="guardarMeta('${p.operador_id}')" class="text-green-600 hover:text-green-800 p-1 rounded hover:bg-green-50 transition">
                                                    <i class="fa-solid fa-check text-xs"></i>
                                                </button>
                                            </span>
                                        </div>
                                    </div>
                                    <div class="w-full md:w-32">
                                        <label class="block text-xs font-bold text-blue-600 mb-1">SKU Logrados</label>
                                        <input type="number" name="prod_${p.operador_id}" placeholder="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-center font-bold text-xl focus:ring-2 focus:ring-blue-500 outline-none transition" required>
                                    </div>
                                </div>
                            `;
                        }
                    });
                }

                document.getElementById('listaPersonas').innerHTML = htmlPersonas;
                panelRegistro.classList.remove('hidden');

            } else {
                panelAuto.classList.add('hidden');
                panelRegistro.classList.add('hidden');
                alert("No hay asignación para esta fecha.");
            }
        });

        document.getElementById('formProductividad').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = 'Guardando...';
            btn.disabled = true;

            const inputsProd = document.querySelectorAll('#listaPersonas input[name^="prod_"]');
            const registros = [];
            const actualizacionesMeta = [];
            const operadoresIds = [];

            inputsProd.forEach(input => {
                const operadorId = input.name.replace('prod_', '');
                operadoresIds.push(operadorId);
                const sku = parseInt(input.value) || 0;
                const metaInput = document.querySelector(`input[name="meta_${operadorId}"]`);
                const metaNueva = parseInt(metaInput.value) || 0;

                registros.push({
                    asignacion_id: asignacionActualId,
                    operador_id: operadorId,
                    sku_revisados: sku,
                    origen: 'manual'
                });

                actualizacionesMeta.push({
                    operador_id: operadorId,
                    meta_del_dia: metaNueva
                });
            });

            // 1. Borrar registros previos de este día para evitar duplicados
            await _supabase.from('productividad')
                .delete()
                .eq('asignacion_id', asignacionActualId)
                .in('operador_id', operadoresIds);

            // 2. Insertar nuevos registros
            const { error: errorProd } = await _supabase.from('productividad').insert(registros);
            
            if (errorProd) {
                mostrarMensaje('Error al guardar: ' + errorProd.message, 'red');
                btn.innerText = 'Guardar Productividad';
                btn.disabled = false;
                return;
            }

            // 3. Actualizar metas
            for (let act of actualizacionesMeta) {
                await _supabase.from('asignacion_personal')
                    .update({ meta_del_dia: act.meta_del_dia, meta_es_especial: true })
                    .eq('asignacion_id', asignacionActualId)
                    .eq('operador_id', act.operador_id);
            }

            mostrarMensaje('¡Productividad y metas guardadas con éxito!', 'green');
            btn.innerText = 'Guardar Productividad';
            btn.disabled = false;
        });

        function mostrarMensaje(texto, color) {
            const msg = document.getElementById('mensajeProd');
            msg.innerText = texto;
            msg.className = `mt-4 text-center font-bold block text-${color}-600`;
            setTimeout(() => { msg.classList.add('hidden'); }, 5000);
        }

        cargarEncargados();
    </script>
</body>
</html>
