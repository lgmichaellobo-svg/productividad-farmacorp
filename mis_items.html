<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Ítems - Farmacorp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Barra Superior -->
    <header class="bg-white shadow-sm px-4 py-4 flex justify-between items-center z-10 border-b border-slate-100">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white"><i class="fa-solid fa-pills text-sm"></i></div>
            <h2 class="text-lg font-bold text-slate-800 tracking-tight">Verificación</h2>
        </div>
        <a href="app.html" class="text-sm text-slate-500 hover:text-slate-800 font-semibold flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Salir
        </a>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-6 w-full max-w-2xl mx-auto">
        
        <!-- Estado de Carga -->
        <div id="loadingState" class="text-center py-20">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-orange-500 mb-4"></i>
            <p class="text-slate-500 font-medium">Buscando tus ítems asignados...</p>
        </div>

        <!-- Estado Vacío (No hay ítems) -->
        <div id="emptyState" class="hidden text-center py-20 bg-white rounded-2xl shadow-sm border border-slate-200">
            <div class="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-check-double text-3xl text-emerald-500"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-2">¡Todo al día!</h3>
            <p class="text-slate-500">No tienes ítems pendientes de verificar en este momento.</p>
        </div>

        <!-- Interfaz de Verificación (Oculta hasta cargar) -->
        <div id="verificacionUI" class="hidden">
            
            <!-- Progreso -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Progreso de revisión</p>
                    <p class="text-sm font-semibold text-slate-800">Ítem <span id="indiceActual">1</span> de <span id="totalItems">0</span></p>
                </div>
                <div class="w-32 bg-slate-100 rounded-full h-2.5">
                    <div id="barraProgreso" class="bg-orange-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- Tarjeta del Ítem -->
            <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden mb-6 relative">
                <div class="bg-orange-50 p-4 border-b border-orange-100 flex justify-between items-center">
                    <span class="bg-white text-orange-600 font-bold px-3 py-1 rounded-lg text-sm shadow-sm border border-orange-200">
                        N° <span id="itemNumLista">-</span>
                    </span>
                    <span class="text-xs font-bold text-orange-800 uppercase tracking-wider"><i class="fa-solid fa-flask mr-1"></i> <span id="itemLab">-</span></span>
                </div>

                <div class="p-6 text-center">
                    <p class="text-sm font-mono text-slate-500 mb-2"><span id="itemCodigo">-</span></p>
                    <h3 class="text-xl font-extrabold text-slate-800 leading-tight mb-6" id="itemDesc">Cargando...</h3>
                    
                    <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <div>
                            <p class="text-xs text-slate-500 font-bold mb-1">Conteo Físico</p>
                            <p class="text-2xl font-black text-slate-800" id="itemConteo">0</p>
                            <p class="text-xs text-slate-400" id="itemUnidad">UND</p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500 font-bold mb-1">Diferencia</p>
                            <p class="text-2xl font-black" id="itemDiferencia">0</p>
                            <p class="text-xs text-slate-400">Bs <span id="itemImporte">0.00</span></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div id="accionesCorrecto" class="grid grid-cols-2 gap-4">
                <button id="btnIncorrecto" class="bg-white border-2 border-rose-100 hover:border-rose-300 text-rose-600 font-bold py-4 rounded-xl transition shadow-sm flex flex-col items-center justify-center gap-2">
                    <i class="fa-solid fa-xmark text-2xl"></i> INCORRECTO
                </button>
                <button id="btnCorrecto" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-emerald-500/30 flex flex-col items-center justify-center gap-2">
                    <i class="fa-solid fa-check text-2xl"></i> CORRECTO
                </button>
            </div>

            <!-- Panel de Cantidad Incorrecta (Oculto por defecto) -->
            <div id="panelIncorrecto" class="hidden bg-white p-6 rounded-2xl shadow-md border border-rose-200">
                <h4 class="text-rose-600 font-bold mb-4"><i class="fa-solid fa-triangle-exclamation"></i> Registrar Error</h4>
                <label class="block text-sm font-medium text-slate-700 mb-2">¿Cuál es la cantidad correcta?</label>
                <input type="number" id="inputCantidadCorrecta" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none text-lg font-bold mb-4" placeholder="Escribe la cantidad real...">
                <div class="flex gap-3">
                    <button id="btnCancelarError" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition">Cancelar</button>
                    <button id="btnGuardarError" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-rose-500/30">Guardar Error</button>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://wwurfjenenlvrhwakmso.supabase.co';
        const supabaseKey = 'sb_publishable_cn1zFLzla27K4l4EPltEbw_8YAgoq0C'; 
        const _supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let itemsUsuario = [];
        let itemActualIndex = 0;

        async function init() {
            // 1. Obtener la sesión del usuario
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            // 2. Buscar el ID del usuario en la tabla 'usuarios' por su correo
            const { data: usuarioDB } = await _supabase
                .from('usuarios')
                .select('id')
                .eq('email', session.user.email)
                .single();

            if (!usuarioDB) {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('emptyState').innerHTML = '<p class="text-rose-500 font-bold">Tu cuenta no está vinculada a un registro de personal.</p>';
                return;
            }

            // 3. Cargar los ítems asignados a este usuario (solo los pendientes)
            const { data: items, error } = await _supabase
                .from('verificacion_items')
                .select('*')
                .eq('asignado_a', usuarioDB.id)
                .eq('estado', 'pendiente')
                .order('numero_lista', { ascending: true }); // Ordenados por la columna N

            if (error) {
                console.error(error);
                return;
            }

            itemsUsuario = items;

            document.getElementById('loadingState').classList.add('hidden');

            if (itemsUsuario.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
            } else {
                document.getElementById('verificacionUI').classList.remove('hidden');
                document.getElementById('totalItems').innerText = itemsUsuario.length;
                mostrarItem(0);
            }
        }

        function mostrarItem(index) {
            if (index >= itemsUsuario.length) {
                // Terminó todos los ítems
                document.getElementById('verificacionUI').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('emptyState').querySelector('h3').innerText = "¡Has terminado!";
                document.getElementById('emptyState').querySelector('p').innerText = "Has verificado todos tus ítems asignados.";
                return;
            }

            const item = itemsUsuario[index];
            
            // Actualizar barra de progreso
            document.getElementById('indiceActual').innerText = index + 1;
            const porcentaje = ((index) / itemsUsuario.length) * 100;
            document.getElementById('barraProgreso').style.width = `${porcentaje}%`;

            // Llenar datos en la tarjeta
            document.getElementById('itemNumLista').innerText = item.numero_lista || '-';
            document.getElementById('itemLab').innerText = item.laboratorio || 'Sin Lab';
            document.getElementById('itemCodigo').innerText = item.codigo || '';
            document.getElementById('itemDesc').innerText = item.descripcion || 'Sin descripción';
            document.getElementById('itemConteo').innerText = item.conteo_fisico;
            document.getElementById('itemUnidad').innerText = item.unidad || 'UND';
            
            // Diferencia (mostrar en rojo si es negativa)
            const dif = item.diferencia;
            const difEl = document.getElementById('itemDiferencia');
            difEl.innerText = dif > 0 ? `+${dif}` : dif;
            difEl.className = dif < 0 ? 'text-2xl font-black text-rose-500' : 'text-2xl font-black text-emerald-500';
            
            document.getElementById('itemImporte').innerText = Math.abs(item.dif_importe).toFixed(2);

            // Ocultar panel de error si estaba abierto
            document.getElementById('panelIncorrecto').classList.add('hidden');
            document.getElementById('accionesCorrecto').classList.remove('hidden');
            document.getElementById('inputCantidadCorrecta').value = '';
        }

        // Acción: CORRECTO
        document.getElementById('btnCorrecto').addEventListener('click', async () => {
            const item = itemsUsuario[itemActualIndex];
            // Actualizar en Supabase (simulado rápido)
            item.estado = 'correcto';
            itemActualIndex++;
            mostrarItem(itemActualIndex);
            
            await _supabase.from('verificacion_items').update({ estado: 'correcto' }).eq('id', item.id);
        });

        // Acción: INCORRECTO (Abrir panel)
        document.getElementById('btnIncorrecto').addEventListener('click', () => {
            document.getElementById('accionesCorrecto').classList.add('hidden');
            document.getElementById('panelIncorrecto').classList.remove('hidden');
            document.getElementById('inputCantidadCorrecta').focus();
        });

        // Acción: CANCELAR ERROR
        document.getElementById('btnCancelarError').addEventListener('click', () => {
            document.getElementById('panelIncorrecto').classList.add('hidden');
            document.getElementById('accionesCorrecto').classList.remove('hidden');
        });

        // Acción: GUARDAR ERROR
        document.getElementById('btnGuardarError').addEventListener('click', async () => {
            const cant = parseFloat(document.getElementById('inputCantidadCorrecta').value);
            if (isNaN(cant)) {
                alert("Por favor, ingresa una cantidad válida.");
                return;
            }

            const btn = document.getElementById('btnGuardarError');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            btn.disabled = true;

            const item = itemsUsuario[itemActualIndex];
            
            // Guardar en Supabase
            await _supabase.from('verificacion_items').update({ 
                estado: 'incorrecto',
                cantidad_correcta: cant,
                fecha_verificacion: new Date().toISOString()
            }).eq('id', item.id);

            btn.innerHTML = 'Guardar Error';
            btn.disabled = false;
            
            itemActualIndex++;
            mostrarItem(itemActualIndex);
        });

        // Iniciar
        init();
    </script>
</body>
</html>
